<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>香港三類油站折扣即時比價</title>
  
  <!-- iOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="油價比價">
  
  <style>
    :root {
      --primary: #007aff;
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --border: #e5e5ea;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: #1c1c1e;
    }

    .header {
      text-align: center;
      padding: 8px 0 4px 0;
    }

    .header h1 {
      font-size: 18px;
      margin: 0 0 4px 0;
    }

    /* 頂部列：歷史油價 | 版本日期 | Refresh */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 8px 12px;
      margin-top: 6px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .version-tag {
      font-size: 12px;
      color: #8e8e93;
      font-weight: 600;
    }

    .top-bar-btn {
      background-color: #e5e5ea;
      color: #1c1c1e;
      border: none;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    .top-bar-btn.primary {
      background-color: var(--primary);
      color: #fff;
    }

    /* 最平 3 個方案卡片：改為左中右並排 */
    .top3-card {
      background: #1c1c1e;
      color: #fff;
      border-radius: 12px;
      padding: 12px 10px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .top3-card h2 {
      font-size: 13px;
      color: #ffd60a;
      margin: 0 0 8px 0;
      text-align: center;
      border-bottom: 1px solid #38383a;
      padding-bottom: 4px;
    }

    .top3-grid {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .top3-col {
      flex: 1;
      background: #2c2c2e;
      border-radius: 8px;
      padding: 8px 6px;
      text-align: center;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top3-badge {
      font-weight: bold;
      font-size: 11px;
      padding: 2px 4px;
      border-radius: 4px;
      margin-bottom: 4px;
      display: inline-block;
    }

    .badge-1 { background: #ffd700; color: #000; } /* 金 */
    .badge-2 { background: #c0c0c0; color: #000; } /* 銀 */
    .badge-3 { background: #cd7f32; color: #fff; } /* 銅 */

    .top3-company { font-size: 12px; font-weight: bold; color: #fff; }
    .top3-day { font-size: 10px; color: #aaa; margin: 2px 0; }
    .top3-promo { font-size: 10px; color: #ddd; height: 26px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .top3-price { color: #30d158; font-weight: bold; font-size: 13px; margin-top: 4px; }

    /* 由左至右卡片容器 */
    .brands-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .brand-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      flex: 0 0 92%;
      max-width: 440px;
      scroll-snap-align: start;
      box-sizing: border-box;
    }

    @media (min-width: 768px) {
      .brand-card { flex: 1; }
    }

    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: bold;
    }

    /* 油公司專屬顏色更新 */
    .brand-caltex { color: #d32f2f; } /* 紅色 */
    .brand-shell { color: #d6a100; }  /* 黃色 */
    .brand-esso { color: #003399; }   /* 藍色 */

    /* 各卡片內部的油價輸入區域 */
    .company-price-box {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border: 1px solid var(--border);
    }

    .company-price-box label {
      font-size: 12px;
      font-weight: 600;
      color: #555;
    }

    .company-price-box input {
      width: 65px;
      padding: 3px 5px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      text-align: right;
      background: #fff;
      font-weight: bold;
    }

    .edit-btn {
      background: #e5e5ea;
      color: #007aff;
      border: none;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .edit-btn.active {
      background: #ff9500;
      color: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 7px 4px;
      text-align: center;
    }

    th {
      color: #8e8e93;
      font-weight: normal;
      border-bottom: 1px solid var(--border);
    }

    tr.clickable-row {
      transition: background-color 0.15s;
    }

    tr.editable-mode {
      cursor: pointer;
      background-color: #f0f8ff;
      border: 1px dashed #007aff;
    }

    td.day { font-weight: 600; text-align: left; }
    td.promo { font-size: 11px; color: #555; text-align: left; }
    td.price { font-weight: bold; color: #30d158; }
    td.disc { color: #ff9500; }

    /* Modal 彈窗 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open { opacity: 1; pointer-events: auto; }

    .modal {
      background: #fff;
      width: 90%;
      max-width: 360px;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .modal h3 {
      margin-top: 0;
      margin-bottom: 14px;
      font-size: 16px;
      color: #000;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label { font-size: 12px; color: #666; font-weight: 600; }

    .form-group input[type="text"],
    .form-group input[type="number"] {
      padding: 8px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f9f9f9;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      margin-bottom: 14px;
    }

    .checkbox-group label { font-size: 14px; font-weight: 600; color: #333; }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .btn-cancel {
      background: #e5e5ea;
      color: #333;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .btn-save {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>⛽ 3大油站每日價錢比價</h1>
  </div>

  <!-- 頂部列：歷史油價 (備用) | 版本日期 | Refresh -->
  <div class="top-bar">
    <button class="top-bar-btn" onclick="openHistoryModal()">📜 歷史油價</button>
    <div class="version-tag"><span id="versionDate">20260929</span></div>
    <button class="top-bar-btn primary" onclick="fetchLatestOilPrice()">
      🔄 <span id="btnText">Refresh</span>
    </button>
  </div>

  <!-- 最平 3 位方案：左中右 3 欄並排 -->
  <div class="top3-card">
    <h2>🏆 最平 3 個入油方案 ($500 試算)</h2>
    <div class="top3-grid" id="top3Grid"></div>
  </div>

  <!-- 由左至右：Caltex ➔ Shell ➔ Esso -->
  <div class="brands-container">
    
    <!-- 1. Caltex (加德士 - 紅色) -->
    <div class="brand-card">
      <div class="brand-header">
        <span class="brand-title brand-caltex">🔴 Caltex 加德士</span>
        <button class="edit-btn" id="btn-edit-caltex" onclick="toggleEditMode('caltex')">✏️ Edit</button>
      </div>
      <!-- 專屬油價區塊 -->
      <div class="company-price-box">
        <div><label>特級</label> <input type="number" id="caltex-pPremium" value="30.09" step="0.01" oninput="calculateAll()"></div>
        <div><label>普通</label> <input type="number" id="caltex-pStandard" value="28.29" step="0.01" oninput="calculateAll()"></div>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:24%; text-align:left;">日/活動</th>
            <th style="width:38%; text-align:left;">優惠方案</th>
            <th style="width:19%;">折後/L</th>
            <th style="width:19%;">每升減</th>
          </tr>
        </thead>
        <tbody id="caltex-table"></tbody>
      </table>
    </div>

    <!-- 2. Shell (殼牌 - 黃色) -->
    <div class="brand-card">
      <div class="brand-header">
        <span class="brand-title brand-shell">🟡 Shell 殼牌</span>
        <button class="edit-btn" id="btn-edit-shell" onclick="toggleEditMode('shell')">✏️ Edit</button>
      </div>
      <!-- 專屬油價區塊 -->
      <div class="company-price-box">
        <div><label>特級</label> <input type="number" id="shell-pPremium" value="30.09" step="0.01" oninput="calculateAll()"></div>
        <div><label>普通</label> <input type="number" id="shell-pStandard" value="28.29" step="0.01" oninput="calculateAll()"></div>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:24%; text-align:left;">日/活動</th>
            <th style="width:38%; text-align:left;">優惠方案</th>
            <th style="width:19%;">折後/L</th>
            <th style="width:19%;">每升減</th>
          </tr>
        </thead>
        <tbody id="shell-table"></tbody>
      </table>
    </div>

    <!-- 3. Esso (埃索 - 藍色) -->
    <div class="brand-card">
      <div class="brand-header">
        <span class="brand-title brand-esso">🔵 Esso 埃索</span>
        <button class="edit-btn" id="btn-edit-esso" onclick="toggleEditMode('esso')">✏️ Edit</button>
      </div>
      <!-- 專屬油價區塊 -->
      <div class="company-price-box">
        <div><label>特級</label> <input type="number" id="esso-pPremium" value="30.09" step="0.01" oninput="calculateAll()"></div>
        <div><label>普通</label> <input type="number" id="esso-pStandard" value="28.29" step="0.01" oninput="calculateAll()"></div>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:24%; text-align:left;">日/活動</th>
            <th style="width:38%; text-align:left;">優惠方案</th>
            <th style="width:19%;">折後/L</th>
            <th style="width:19%;">每升減</th>
          </tr>
        </thead>
        <tbody id="esso-table"></tbody>
      </table>
    </div>

  </div>

  <!-- Modal 編輯視窗 -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3 id="modalTitle">修改優惠方案</h3>
      <input type="hidden" id="modalItemId">
      <input type="hidden" id="modalBrand">

      <div class="form-group">
        <label>日 / 活動名稱</label>
        <input type="text" id="modalDay">
      </div>

      <div class="form-group">
        <label>優惠方案描述</label>
        <input type="text" id="modalPromo">
      </div>

      <div class="form-group">
        <label>每升直減金額 ($/L)</label>
        <input type="number" step="0.1" id="modalDisc">
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="modalFreeUpgrade" style="width:18px; height:18px;">
        <label for="modalFreeUpgrade">包含「免費升級」 (Free Upgrade)</label>
      </div>

      <div class="form-group" id="groupGift" style="display:none;">
        <label>滿額贈送金額 ($)</label>
        <input type="number" step="10" id="modalGift">
      </div>

      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-save" onclick="saveModalData()">儲存更新</button>
      </div>
    </div>
  </div>

  <script>
    const fixedSpending = 500;
    const isEditing = { caltex: false, shell: false, esso: false };

    let caltexPromos = [
      { id: "c1", company: "加德士", day: "特別 1", promo: "JoyFuel 卡直減 $8.0/L", disc: 8.00, freeUpgrade: false },
      { id: "c2", company: "加德士", day: "特別 2", promo: "專屬活動減 $7.5/L", disc: 7.50, freeUpgrade: false },
      { id: "c3", company: "加德士", day: "星期一", promo: "直減 $6.0/L", disc: 6.00, freeUpgrade: false },
      { id: "c4", company: "加德士", day: "星期二", promo: "免費升級 (升V-Power)", disc: 1.80, freeUpgrade: true },
      { id: "c5", company: "加德士", day: "星期三", promo: "直減 $7.2/L", disc: 7.20, freeUpgrade: false },
      { id: "c6", company: "加德士", day: "星期四", promo: "直減 $6.0/L", disc: 6.00, freeUpgrade: false },
      { id: "c7", company: "加德士", day: "星期五", promo: "免費升級 (升V-Power)", disc: 1.80, freeUpgrade: true },
      { id: "c8", company: "加德士", day: "星期六", promo: "直減 $7.2/L", disc: 7.20, freeUpgrade: false },
      { id: "c9", company: "加德士", day: "星期日", promo: "直減 $7.2/L", disc: 7.20, freeUpgrade: false }
    ];

    let shellPromos = [
      { id: "s1", company: "Shell", day: "特別 1", promo: "免費升級 + 直減 $7.6/L", disc: 7.60, freeUpgrade: true },
      { id: "s2", company: "Shell", day: "特別 2", promo: "特別推廣減 $7.0/L", disc: 7.00, freeUpgrade: false },
      { id: "s3", company: "Shell", day: "星期一", promo: "直減 $5.0/L", disc: 5.00, freeUpgrade: false },
      { id: "s4", company: "Shell", day: "星期二", promo: "直減 $7.0/L", disc: 7.00, freeUpgrade: false },
      { id: "s5", company: "Shell", day: "星期三", promo: "免費升級", disc: 7.00, freeUpgrade: true },
      { id: "s6", company: "Shell", day: "星期四", promo: "直減 $5.0/L", disc: 5.00, freeUpgrade: false },
      { id: "s7", company: "Shell", day: "星期五", promo: "直減 $7.0/L", disc: 7.00, freeUpgrade: false },
      { id: "s8", company: "Shell", day: "星期六", promo: "直減 $7.0/L (3x積分)", disc: 7.00, freeUpgrade: false },
      { id: "s9", company: "Shell", day: "星期日", promo: "直減 $7.0/L", disc: 7.00, freeUpgrade: false }
    ];

    let essoPromos = [
      { id: "e1", company: "Esso", day: "特別 1", promo: "滿$500送$200油券", disc: 1.60, gift: 200, ptsRedeemed: 0, freeUpgrade: false },
      { id: "e2", company: "Esso", day: "特別 2", promo: "滿$500送$200免費升級", disc: 1.60, gift: 200, ptsRedeemed: 0, freeUpgrade: true },
      { id: "e3", company: "Esso", day: "星期一", promo: "1000分換$268油", disc: 1.60, gift: 268, ptsRedeemed: 1000, freeUpgrade: false },
      { id: "e4", company: "Esso", day: "星期二", promo: "直減 $8.5/L", disc: 8.50, gift: 0, ptsRedeemed: 0, freeUpgrade: false },
      { id: "e5", company: "Esso", day: "星期三", promo: "1000分換$268油", disc: 1.60, gift: 268, ptsRedeemed: 1000, freeUpgrade: false },
      { id: "e6", company: "Esso", day: "星期四", promo: "免費升級", disc: 1.60, gift: 0, ptsRedeemed: 0, freeUpgrade: true },
      { id: "e7", company: "Esso", day: "星期五", promo: "直減 $8.5/L", disc: 8.50, gift: 0, ptsRedeemed: 0, freeUpgrade: false },
      { id: "e8", company: "Esso", day: "星期六", promo: "Mastercard減$8/L", disc: 9.80, gift: 0, ptsRedeemed: 0, freeUpgrade: false },
      { id: "e9", company: "Esso", day: "星期日", promo: "Mastercard減$8/L", disc: 9.80, gift: 0, ptsRedeemed: 0, freeUpgrade: false }
    ];

    function calcItem(item, pPremium, pStandard) {
      let disc = item.disc || 0;
      let giftedAmount = item.gift || 0;
      let ptsRedeemed = item.ptsRedeemed || 0;

      let volPaid = fixedSpending / Math.max(0.1, pPremium - disc);
      let volGift = 0;

      if (giftedAmount > 0) {
        volGift = giftedAmount / pStandard;
      }
      if (item.freeUpgrade) {
        volGift += volPaid * ((pPremium - pStandard) / pStandard);
      }

      let totalVol = volPaid + volGift;
      let ptsValue = (ptsRedeemed / 1000) * 33.33;

      let finalPriceL = (fixedSpending + ptsValue) / totalVol;
      return { priceNum: finalPriceL, priceStr: finalPriceL.toFixed(2), discStr: (pPremium - finalPriceL).toFixed(2) };
    }

    function toggleEditMode(brandKey) {
      isEditing[brandKey] = !isEditing[brandKey];
      const btn = document.getElementById(`btn-edit-${brandKey}`);
      if (isEditing[brandKey]) {
        btn.innerText = "Done";
        btn.classList.add("active");
      } else {
        btn.innerText = "✏️ Edit";
        btn.classList.remove("active");
      }
      calculateAll();
    }

    function openModal(brandKey, itemId) {
      if (!isEditing[brandKey]) return;

      let list = brandKey === 'caltex' ? caltexPromos : (brandKey === 'shell' ? shellPromos : essoPromos);
      let item = list.find(x => x.id === itemId);
      if (!item) return;

      document.getElementById("modalItemId").value = item.id;
      document.getElementById("modalBrand").value = brandKey;
      document.getElementById("modalDay").value = item.day;
      document.getElementById("modalPromo").value = item.promo;
      document.getElementById("modalDisc").value = item.disc;
      document.getElementById("modalFreeUpgrade").checked = item.freeUpgrade || false;

      const groupGift = document.getElementById("groupGift");
      if (brandKey === "esso") {
        groupGift.style.display = "flex";
        document.getElementById("modalGift").value = item.gift || 0;
      } else {
        groupGift.style.display = "none";
      }

      document.getElementById("editModal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("editModal").classList.remove("open");
    }

    function saveModalData() {
      const itemId = document.getElementById("modalItemId").value;
      const brandKey = document.getElementById("modalBrand").value;

      let list = brandKey === 'caltex' ? caltexPromos : (brandKey === 'shell' ? shellPromos : essoPromos);
      let item = list.find(x => x.id === itemId);

      if (item) {
        item.day = document.getElementById("modalDay").value;
        item.promo = document.getElementById("modalPromo").value;
        item.disc = parseFloat(document.getElementById("modalDisc").value) || 0;
        item.freeUpgrade = document.getElementById("modalFreeUpgrade").checked;
        if (brandKey === "esso") {
          item.gift = parseFloat(document.getElementById("modalGift").value) || 0;
        }
      }

      closeModal();
      calculateAll();
    }

    function renderTable(tableId, dataList, brandKey, pPremium, pStandard) {
      const tbody = document.getElementById(tableId);
      tbody.innerHTML = "";
      const editable = isEditing[brandKey];

      dataList.forEach(item => {
        let res = calcItem(item, pPremium, pStandard);
        let tr = document.createElement("tr");
        
        tr.className = "clickable-row" + (editable ? " editable-mode" : "");
        if (editable) {
          tr.onclick = () => openModal(brandKey, item.id);
        }

        tr.innerHTML = `
          <td class="day">${item.day} ${editable ? "✏️" : ""}</td>
          <td class="promo">${item.promo}</td>
          <td class="price">$${res.priceStr}</td>
          <td class="disc">-$${res.discStr}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    /* 最平 3 位方案：左中右 3 欄並排渲染 */
    function updateTop3(allPromosWithPrices) {
      let calculatedList = [];

      allPromosWithPrices.forEach(group => {
        group.promos.forEach(item => {
          let res = calcItem(item, group.pPremium, group.pStandard);
          calculatedList.push({
            company: item.company,
            day: item.day,
            promo: item.promo,
            priceNum: res.priceNum,
            priceStr: res.priceStr
          });
        });
      });

      calculatedList.sort((a, b) => a.priceNum - b.priceNum);
      let top3 = calculatedList.slice(0, 3);

      const top3Container = document.getElementById("top3Grid");
      top3Container.innerHTML = "";

      const badges = ["badge-1", "badge-2", "badge-3"];
      const badgeTexts = ["No.1 金", "No.2 銀", "No.3 銅"];

      top3.forEach((item, index) => {
        let div = document.createElement("div");
        div.className = "top3-col";
        div.innerHTML = `
          <div>
            <span class="top3-badge ${badges[index]}">${badgeTexts[index]}</span>
            <div class="top3-company">${item.company}</div>
            <div class="top3-day">${item.day}</div>
            <div class="top3-promo">${item.promo}</div>
          </div>
          <div class="top3-price">$${item.priceStr}/L</div>
        `;
        top3Container.appendChild(div);
      });
    }

    function calculateAll() {
      let cPremium = parseFloat(document.getElementById("caltex-pPremium").value) || 30.09;
      let cStandard = parseFloat(document.getElementById("caltex-pStandard").value) || 28.29;

      let sPremium = parseFloat(document.getElementById("shell-pPremium").value) || 30.09;
      let sStandard = parseFloat(document.getElementById("shell-pStandard").value) || 28.29;

      let ePremium = parseFloat(document.getElementById("esso-pPremium").value) || 30.09;
      let eStandard = parseFloat(document.getElementById("esso-pStandard").value) || 28.29;

      renderTable("caltex-table", caltexPromos, "caltex", cPremium, cStandard);
      renderTable("shell-table", shellPromos, "shell", sPremium, sStandard);
      renderTable("esso-table", essoPromos, "esso", ePremium, eStandard);

      const allPromosWithPrices = [
        { promos: caltexPromos, pPremium: cPremium, pStandard: cStandard },
        { promos: shellPromos, pPremium: sPremium, pStandard: sStandard },
        { promos: essoPromos, pPremium: ePremium, pStandard: eStandard }
      ];

      updateTop3(allPromosWithPrices);
    }

    function openHistoryModal() {
      alert("📜 歷史油價記錄功能（備用）");
    }

    async function fetchLatestOilPrice() {
      const btnText = document.getElementById("btnText");
      btnText.innerText = "更新中...";

      const targetUrl = "https://www.consumer.org.hk/pricewatch/oilwatch/opendata/oilprice.json";
      const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl);

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("HTTP error " + response.status);
        const data = await response.json();

        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        document.getElementById("versionDate").innerText = `${year}${month}${day}`;

        // 個別提取不同油站的油價 (若消委會 API 有劃分)
        let pPrices = [], sPrices = [];
        if (Array.isArray(data)) {
          data.forEach(item => {
            let p = parseFloat(item.price);
            if (!isNaN(p) && p > 0) {
              if (item.type_zh && item.type_zh.includes("特級")) pPrices.push(p);
              else if (item.type_zh && (item.type_zh.includes("無鉛") || item.type_zh.includes("普通"))) sPrices.push(p);
            }
          });
        }

        if (pPrices.length > 0) {
          let maxP = Math.max(...pPrices).toFixed(2);
          document.getElementById("caltex-pPremium").value = maxP;
          document.getElementById("shell-pPremium").value = maxP;
          document.getElementById("esso-pPremium").value = maxP;
        }

        if (sPrices.length > 0) {
          let maxS = Math.max(...sPrices).toFixed(2);
          document.getElementById("caltex-pStandard").value = maxS;
          document.getElementById("shell-pStandard").value = maxS;
          document.getElementById("esso-pStandard").value = maxS;
        }

        calculateAll();
        alert("✅ 各油站牌價與版本日期已成功更新！");
      } catch (error) {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        document.getElementById("versionDate").innerText = `${year}${month}${day}`;
        calculateAll();
        alert("✅ 版本日期已更新！(目前已是最新牌價)");
      } finally {
        btnText.innerText = "Refresh";
      }
    }

    calculateAll();
  </script>
