<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>香港三類油站折扣即時比價</title>
  
  <!-- iOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="油價比價">
  
  <style>
    :root {
      --primary: #007aff;
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --border: #e5e5ea;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: #1c1c1e;
    }

    .header {
      text-align: center;
      padding: 10px 0;
    }

    .header h1 {
      font-size: 20px;
      margin: 0;
    }

    /* 頂部 2 種油價顯示/輸入區域 */
    .prices-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .price-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .price-group label {
      font-size: 14px;
      font-weight: 600;
    }

    .price-group input {
      width: 75px;
      padding: 6px 8px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: right;
      background: #f9f9f9;
      font-weight: bold;
    }

    /* 由左至右水平滑動容器 */
    .brands-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .brand-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      flex: 0 0 88%; /* 手機畫面上可左右滑動切換 */
      max-width: 420px;
      scroll-snap-align: start;
      box-sizing: border-box;
    }

    @media (min-width: 768px) {
      .brand-card {
        flex: 1; /* 大螢幕/平板平分呈現 */
      }
    }

    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: bold;
    }

    .brand-caltex { color: #00838f; }
    .brand-shell { color: #d6a100; }
    .brand-esso { color: #e60012; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 6px 4px;
      text-align: center;
    }

    th {
      color: #8e8e93;
      font-weight: normal;
      border-bottom: 1px solid var(--border);
    }

    td.day {
      font-weight: 600;
      text-align: left;
      width: 24%;
    }

    td.promo {
      font-size: 11px;
      color: #666;
      text-align: left;
      width: 38%;
    }

    td.price {
      font-weight: bold;
      color: #30d158;
      width: 19%;
    }

    td.disc {
      color: #ff9500;
      width: 19%;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>⛽ 3大油站每日價錢比價</h1>
  </div>

  <!-- 頂部顯示 2 種汽油牌價 -->
  <div class="prices-card">
    <div class="price-group">
      <label for="pPremium">特級汽油</label>
      <input type="number" id="pPremium" value="30.09" step="0.01" oninput="calculateAll()">
    </div>
    <div class="price-group">
      <label for="pStandard">普通汽油</label>
      <input type="number" id="pStandard" value="28.29" step="0.01" oninput="calculateAll()">
    </div>
  </div>

  <!-- 由左至右：Caltex ➔ Shell ➔ Esso -->
  <div class="brands-container">
    
    <!-- 1. Caltex (加德士) -->
    <div class="brand-card">
      <div class="brand-header">
        <span class="brand-title brand-caltex">🟢 Caltex 加德士</span>
      </div>
      <table>
        <thead>
          <tr>
            <th style="text-align: left;">日/活動</th>
            <th style="text-align: left;">優惠方案</th>
            <th>折後每升</th>
            <th>每升總減</th>
          </tr>
        </thead>
        <tbody id="caltex-table"></tbody>
      </table>
    </div>

    <!-- 2. Shell (殼牌) -->
    <div class="brand-card">
      <div class="brand-header">
        <span class="brand-title brand-shell">🟡 Shell 殼牌</span>
      </div>
      <table>
        <thead>
          <tr>
            <th style="text-align: left;">日/活動</th>
            <th style="text-align: left;">優惠方案</th>
            <th>折後每升</th>
            <th>每升總減</th>
          </tr>
        </thead>
        <tbody id="shell-table"></tbody>
      </table>
    </div>

    <!-- 3. Esso (埃索) -->
    <div class="brand-card">
      <div class="brand-header">
        <span class="brand-title brand-esso">🔴 Esso 埃索</span>
      </div>
      <table>
        <thead>
          <tr>
            <th style="text-align: left;">日/活動</th>
            <th style="text-align: left;">優惠方案</th>
            <th>折後每升</th>
            <th>每升總減</th>
          </tr>
        </thead>
        <tbody id="esso-table"></tbody>
      </table>
    </div>

  </div>

  <script>
    // 固定計算基準花費為 $500 算例
    const fixedSpending = 500;

    // 1. Caltex: 特別1, 特別2, 星期一 ~ 星期日
    const caltexPromos = [
      { day: "特別 1", promo: "JoyFuel 卡直減 $8.0/L", disc: 8.00 },
      { day: "特別 2", promo: "加德士專屬活動減 $7.5/L", disc: 7.50 },
      { day: "星期一", promo: "直減 $6.0/L", disc: 6.00 },
      { day: "星期二", promo: "免費升級 (免費升V-Power)", disc: 1.80, freeUpgrade: true },
      { day: "星期三", promo: "直減 $7.2/L", disc: 7.20 },
      { day: "星期四", promo: "直減 $6.0/L", disc: 6.00 },
      { day: "星期五", promo: "免費升級 (免費升V-Power)", disc: 1.80, freeUpgrade: true },
      { day: "星期六", promo: "直減 $7.2/L", disc: 7.20 },
      { day: "星期日", promo: "直減 $7.2/L", disc: 7.20 }
    ];

    // 2. Shell: 特別1, 特別2, 星期一 ~ 星期日 (完全依照 Excel 紀錄)
    const shellPromos = [
      { day: "特別 1", promo: "免費升級 + 直減 $7.6/L (3x分)", disc: 7.60, freeUpgrade: true },
      { day: "特別 2", promo: "特別推廣減 $7.0/L", disc: 7.00 },
      { day: "星期一", promo: "直減 $5.0/L", disc: 5.00 },
      { day: "星期二", promo: "直減 $7.0/L", disc: 7.00 },
      { day: "星期三", promo: "免費升級", disc: 7.00, freeUpgrade: true },
      { day: "星期四", promo: "直減 $5.0/L", disc: 5.00 },
      { day: "星期五", promo: "直減 $7.0/L", disc: 7.00 },
      { day: "星期六", promo: "直減 $7.0/L (3x積分)", disc: 7.00 },
      { day: "星期日", promo: "直減 $7.0/L", disc: 7.00 }
    ];

    // 3. Esso: 特別1, 特別2, 星期一 ~ 星期日 (完全依照 Excel 紀錄)
    const essoPromos = [
      { day: "特別 1", promo: "滿$500送$200油券", disc: 1.60, gift: 200 },
      { day: "特別 2", promo: "滿$500送$200免費升級", disc: 1.60, gift: 200, freeUpgrade: true },
      { day: "星期一", promo: "1000分換$268油", disc: 1.60, gift: 268, ptsRedeemed: 1000 },
      { day: "星期二", promo: "直減 $8.5/L", disc: 8.50 },
      { day: "星期三", promo: "1000分換$268油", disc: 1.60, gift: 268, ptsRedeemed: 1000 },
      { day: "星期四", promo: "免費升級", disc: 1.60, freeUpgrade: true },
      { day: "星期五", promo: "直減 $8.5/L", disc: 8.50 },
      { day: "星期六", promo: "Mastercard減$8/L (2x分)", disc: 9.80 },
      { day: "星期日", promo: "Mastercard減$8/L (2x分)", disc: 9.80 }
    ];

    function calcRow(item, pPremium, pStandard) {
      let disc = item.disc;
      let giftedAmount = item.gift || 0;
      let ptsRedeemed = item.ptsRedeemed || 0;

      let volPaid = fixedSpending / (pPremium - disc);
      let volGift = 0;

      if (giftedAmount > 0) {
        volGift = giftedAmount / pStandard;
      } else if (item.freeUpgrade) {
        volGift = volPaid * ((pPremium - pStandard) / pStandard);
      }

      let totalVol = volPaid + volGift;
      let ptsValue = (ptsRedeemed / 1000) * 33.33;

      let finalPriceL = (fixedSpending + ptsValue) / totalVol;
      let totalDiscL = pPremium - finalPriceL;

      return {
        price: finalPriceL.toFixed(2),
        disc: totalDiscL.toFixed(2)
      };
    }

    function renderTable(tableId, dataList, pPremium, pStandard) {
      const tbody = document.getElementById(tableId);
      tbody.innerHTML = "";
      dataList.forEach(item => {
        let res = calcRow(item, pPremium, pStandard);
        let tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="day">${item.day}</td>
          <td class="promo">${item.promo}</td>
          <td class="price">$${res.price}</td>
          <td class="disc">-$${res.disc}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function calculateAll() {
      let pPremium = parseFloat(document.getElementById("pPremium").value) || 30.09;
      let pStandard = parseFloat(document.getElementById("pStandard").value) || 28.29;

      renderTable("caltex-table", caltexPromos, pPremium, pStandard);
      renderTable("shell-table", shellPromos, pPremium, pStandard);
      renderTable("esso-table", essoPromos, pPremium, pStandard);
    }

    calculateAll();
  </script>
</body>
</html>
