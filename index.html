<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>香港三類油站折扣即時比價</title>
  
  <!-- iOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="油價比價">
  
  <style>
    :root {
      --primary: #007aff;
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --border: #e5e5ea;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: #1c1c1e;
    }

    .header {
      text-align: center;
      padding: 8px 0 4px 0;
    }

    .header h1 {
      font-size: 18px;
      margin: 0 0 4px 0;
    }

    .version-tag {
      font-size: 12px;
      color: #8e8e93;
      font-weight: 500;
    }

    /* 頂部油價與 Refresh */
    .prices-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 10px 14px;
      margin-top: 6px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .price-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .price-group label {
      font-size: 13px;
      font-weight: 600;
    }

    .price-group input {
      width: 70px;
      padding: 4px 6px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      text-align: right;
      background: #f9f9f9;
      font-weight: bold;
    }

    .refresh-btn {
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    /* 最平 3 個方案卡片 */
    .top3-card {
      background: #1c1c1e;
      color: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .top3-card h2 {
      font-size: 14px;
      color: #ffd60a;
      margin: 0 0 8px 0;
      border-bottom: 1px solid #38383a;
      padding-bottom: 4px;
    }

    .top3-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 13px;
    }

    .top3-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .top3-badge {
      background: #30d158;
      color: #000;
      font-weight: bold;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 6px;
    }

    .top3-price {
      color: #30d158;
      font-weight: bold;
    }

    /* 由左至右卡片容器 */
    .brands-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .brand-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      flex: 0 0 92%;
      max-width: 440px;
      scroll-snap-align: start;
      box-sizing: border-box;
    }

    @media (min-width: 768px) {
      .brand-card {
        flex: 1;
      }
    }

    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: bold;
    }

    .edit-btn {
      background: #e5e5ea;
      color: #007aff;
      border: none;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .edit-btn.saving {
      background: #30d158;
      color: #fff;
    }

    .brand-caltex { color: #00838f; }
    .brand-shell { color: #d6a100; }
    .brand-esso { color: #e60012; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th, td {
      padding: 5px 3px;
      text-align: center;
    }

    th {
      color: #8e8e93;
      font-weight: normal;
      border-bottom: 1px solid var(--border);
    }

    td.day {
      font-weight: 600;
      text-align: left;
    }

    td.promo {
      font-size: 11px;
      color: #555;
      text-align: left;
    }

    td.price {
      font-weight: bold;
      color: #30d158;
    }

    td.disc {
      color: #ff9500;
    }

    /* 編輯模式樣式 */
    .edit-input {
      width: 95%;
      padding: 3px;
      font-size: 11px;
      border: 1px solid #007aff;
      border-radius: 4px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>⛽ 3大油站每日價錢比價</h1>
    <div class="version-tag">版本日期: <span id="versionDate">20260929</span></div>
  </div>

  <div class="prices-card">
    <div class="price-group">
      <label for="pPremium">特級</label>
      <input type="number" id="pPremium" value="30.09" step="0.01" oninput="calculateAll()">
    </div>
    <div class="price-group">
      <label for="pStandard">普通</label>
      <input type="number" id="pStandard" value="28.29" step="0.01" oninput="calculateAll()">
    </div>
    <button class="refresh-btn" onclick="fetchLatestOilPrice()">
      🔄 <span id="btnText">Refresh</span>
    </button>
  </div>

  <div class="top3-card">
    <h2>🏆 最平 3 個入油方案 ($500 試算)</h2>
    <div class="top3-list" id="top3List"></div>
  </div>

  <!-- 由左至右：Caltex ➔ Shell ➔ Esso -->
  <div class="brands-container">
    
    <!-- 1. Caltex Section -->
    <div class="brand-card">
      <div class="brand-header">
        <span class="brand-title brand-caltex">🟢 Caltex 加德士</span>
        <button class="edit-btn" id="btn-edit-caltex" onclick="toggleEdit('caltex')">✏️ Edit</button>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:22%; text-align:left;">日/活動</th>
            <th style="width:40%; text-align:left;">優惠方案</th>
            <th style="width:19%;">折後/L</th>
            <th style="width:19%;">每升減</th>
          </tr>
        </thead>
        <tbody id="caltex-table"></tbody>
      </table>
    </div>

    <!-- 2. Shell Section -->
    <div class="brand-card">
      <div class="brand-header">
        <span class="brand-title brand-shell">🟡 Shell 殼牌</span>
        <button class="edit-btn" id="btn-edit-shell" onclick="toggleEdit('shell')">✏️ Edit</button>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:22%; text-align:left;">日/活動</th>
            <th style="width:40%; text-align:left;">優惠方案</th>
            <th style="width:19%;">折後/L</th>
            <th style="width:19%;">每升減</th>
          </tr>
        </thead>
        <tbody id="shell-table"></tbody>
      </table>
    </div>

    <!-- 3. Esso Section -->
    <div class="brand-card">
      <div class="brand-header">
        <span class="brand-title brand-esso">🔴 Esso 埃索</span>
        <button class="edit-btn" id="btn-edit-esso" onclick="toggleEdit('esso')">✏️ Edit</button>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:22%; text-align:left;">日/活動</th>
            <th style="width:40%; text-align:left;">優惠方案</th>
            <th style="width:19%;">折後/L</th>
            <th style="width:19%;">每升減</th>
          </tr>
        </thead>
        <tbody id="esso-table"></tbody>
      </table>
    </div>

  </div>

  <script>
    const fixedSpending = 500;

    // 各公司狀態（編輯狀態與數據集）
    const editState = { caltex: false, shell: false, esso: false };

    // 1. Caltex 獨有優惠資料集
    let caltexPromos = [
      { id: "c1", company: "加德士", day: "特別 1", promo: "JoyFuel 卡直減 $8.0/L", disc: 8.00, freeUpgrade: false },
      { id: "c2", company: "加德士", day: "特別 2", promo: "專屬活動減 $7.5/L", disc: 7.50, freeUpgrade: false },
      { id: "c3", company: "加德士", day: "星期一", promo: "直減 $6.0/L", disc: 6.00, freeUpgrade: false },
      { id: "c4", company: "加德士", day: "星期二", promo: "免費升級 (免費升V-Power)", disc: 1.80, freeUpgrade: true },
      { id: "c5", company: "加德士", day: "星期三", promo: "直減 $7.2/L", disc: 7.20, freeUpgrade: false },
      { id: "c6", company: "加德士", day: "星期四", promo: "直減 $6.0/L", disc: 6.00, freeUpgrade: false },
      { id: "c7", company: "加德士", day: "星期五", promo: "免費升級 (免費升V-Power)", disc: 1.80, freeUpgrade: true },
      { id: "c8", company: "加德士", day: "星期六", promo: "直減 $7.2/L", disc: 7.20, freeUpgrade: false },
      { id: "c9", company: "加德士", day: "星期日", promo: "直減 $7.2/L", disc: 7.20, freeUpgrade: false }
    ];

    // 2. Shell 獨有優惠資料集
    let shellPromos = [
      { id: "s1", company: "Shell", day: "特別 1", promo: "免費升級 + 直減 $7.6/L", disc: 7.60, freeUpgrade: true },
      { id: "s2", company: "Shell", day: "特別 2", promo: "特別推廣減 $7.0/L", disc: 7.00, freeUpgrade: false },
      { id: "s3", company: "Shell", day: "星期一", promo: "直減 $5.0/L", disc: 5.00, freeUpgrade: false },
      { id: "s4", company: "Shell", day: "星期二", promo: "直減 $7.0/L", disc: 7.00, freeUpgrade: false },
      { id: "s5", company: "Shell", day: "星期三", promo: "免費升級", disc: 7.00, freeUpgrade: true },
      { id: "s6", company: "Shell", day: "星期四", promo: "直減 $5.0/L", disc: 5.00, freeUpgrade: false },
      { id: "s7", company: "Shell", day: "星期五", promo: "直減 $7.0/L", disc: 7.00, freeUpgrade: false },
      { id: "s8", company: "Shell", day: "星期六", promo: "直減 $7.0/L (3x積分)", disc: 7.00, freeUpgrade: false },
      { id: "s9", company: "Shell", day: "星期日", promo: "直減 $7.0/L", disc: 7.00, freeUpgrade: false }
    ];

    // 3. Esso 獨有優惠資料集
    let essoPromos = [
      { id: "e1", company: "Esso", day: "特別 1", promo: "滿$500送$200油券", disc: 1.60, gift: 200, ptsRedeemed: 0, freeUpgrade: false },
      { id: "e2", company: "Esso", day: "特別 2", promo: "滿$500送$200免費升級", disc: 1.60, gift: 200, ptsRedeemed: 0, freeUpgrade: true },
      { id: "e3", company: "Esso", day: "星期一", promo: "1000分換$268油", disc: 1.60, gift: 268, ptsRedeemed: 1000, freeUpgrade: false },
      { id: "e4", company: "Esso", day: "星期二", promo: "直減 $8.5/L", disc: 8.50, gift: 0, ptsRedeemed: 0, freeUpgrade: false },
      { id: "e5", company: "Esso", day: "星期三", promo: "1000分換$268油", disc: 1.60, gift: 268, ptsRedeemed: 1000, freeUpgrade: false },
      { id: "e6", company: "Esso", day: "星期四", promo: "免費升級", disc: 1.60, gift: 0, ptsRedeemed: 0, freeUpgrade: true },
      { id: "e7", company: "Esso", day: "星期五", promo: "直減 $8.5/L", disc: 8.50, gift: 0, ptsRedeemed: 0, freeUpgrade: false },
      { id: "e8", company: "Esso", day: "星期六", promo: "Mastercard減$8/L (2x分)", disc: 9.80, gift: 0, ptsRedeemed: 0, freeUpgrade: false },
      { id: "e9", company: "Esso", day: "星期日", promo: "Mastercard減$8/L (2x分)", disc: 9.80, gift: 0, ptsRedeemed: 0, freeUpgrade: false }
    ];

    // ================= 獨立計算邏輯 Sections =================

    // SECTION 1: Caltex 專屬計算模組
    function calcCaltexRow(item, pPremium, pStandard) {
      let disc = item.disc || 0;
      let volPaid = fixedSpending / (pPremium - disc);
      let volGift = item.freeUpgrade ? volPaid * ((pPremium - pStandard) / pStandard) : 0;
      let totalVol = volPaid + volGift;
      let finalPriceL = fixedSpending / totalVol;
      return { priceNum: finalPriceL, priceStr: finalPriceL.toFixed(2), discStr: (pPremium - finalPriceL).toFixed(2) };
    }

    // SECTION 2: Shell 專屬計算模組
    function calcShellRow(item, pPremium, pStandard) {
      let disc = item.disc || 0;
      let volPaid = fixedSpending / (pPremium - disc);
      let volGift = item.freeUpgrade ? volPaid * ((pPremium - pStandard) / pStandard) : 0;
      let totalVol = volPaid + volGift;
      let finalPriceL = fixedSpending / totalVol;
      return { priceNum: finalPriceL, priceStr: finalPriceL.toFixed(2), discStr: (pPremium - finalPriceL).toFixed(2) };
    }

    // SECTION 3: Esso 專屬計算模組 (含點數與送券)
    function calcEssoRow(item, pPremium, pStandard) {
      let disc = item.disc || 0;
      let giftedAmount = item.gift || 0;
      let ptsRedeemed = item.ptsRedeemed || 0;

      let volPaid = fixedSpending / (pPremium - disc);
      let volGift = 0;

      if (giftedAmount > 0) {
        volGift = giftedAmount / pStandard;
      } else if (item.freeUpgrade) {
        volGift = volPaid * ((pPremium - pStandard) / pStandard);
      }

      let totalVol = volPaid + volGift;
      let ptsValue = (ptsRedeemed / 1000) * 33.33; // 1000分換 $33.33

      let finalPriceL = (fixedSpending + ptsValue) / totalVol;
      return { priceNum: finalPriceL, priceStr: finalPriceL.toFixed(2), discStr: (pPremium - finalPriceL).toFixed(2) };
    }

    // 通用計算選取
    function calcItem(item, pPremium, pStandard) {
      if (item.company === "加德士") return calcCaltexRow(item, pPremium, pStandard);
      if (item.company === "Shell") return calcShellRow(item, pPremium, pStandard);
      if (item.company === "Esso") return calcEssoRow(item, pPremium, pStandard);
      return { priceNum: 99, priceStr: "0.00", discStr: "0.00" };
    }

    // ================= UI 渲染與編輯控制 =================

    function toggleEdit(brandKey) {
      editState[brandKey] = !editState[brandKey];
      const btn = document.getElementById(`btn-edit-${brandKey}`);
      
      if (editState[brandKey]) {
        btn.innerText = "💾 Save";
        btn.classList.add("saving");
      } else {
        btn.innerText = "✏️ Edit";
        btn.classList.remove("saving");
        saveInputValues(brandKey);
      }
      calculateAll();
    }

    function saveInputValues(brandKey) {
      let list = brandKey === 'caltex' ? caltexPromos : (brandKey === 'shell' ? shellPromos : essoPromos);
      list.forEach(item => {
        const dayEl = document.getElementById(`${item.id}-day`);
        const promoEl = document.getElementById(`${item.id}-promo`);
        const discEl = document.getElementById(`${item.id}-disc`);

        if (dayEl) item.day = dayEl.value;
        if (promoEl) item.promo = promoEl.value;
        if (discEl) item.disc = parseFloat(discEl.value) || 0;
      });
    }

    function renderTable(tableId, dataList, brandKey, pPremium, pStandard) {
      const tbody = document.getElementById(tableId);
      tbody.innerHTML = "";
      const isEditing = editState[brandKey];

      dataList.forEach(item => {
        let res = calcItem(item, pPremium, pStandard);
        let tr = document.createElement("tr");

        if (isEditing) {
          tr.innerHTML = `
            <td><input class="edit-input" id="${item.id}-day" value="${item.day}"></td>
            <td>
              <input class="edit-input" id="${item.id}-promo" value="${item.promo}">
              <div style="margin-top:2px;">減/L: <input type="number" step="0.1" class="edit-input" style="width:50px;" id="${item.id}-disc" value="${item.disc}"></div>
            </td>
            <td class="price">$${res.priceStr}</td>
            <td class="disc">-$${res.discStr}</td>
          `;
        } else {
          tr.innerHTML = `
            <td class="day">${item.day}</td>
            <td class="promo">${item.promo}</td>
            <td class="price">$${res.priceStr}</td>
            <td class="disc">-$${res.discStr}</td>
          `;
        }
        tbody.appendChild(tr);
      });
    }

    function updateTop3(allPromos, pPremium, pStandard) {
      let calculatedList = allPromos.map(item => {
        let res = calcItem(item, pPremium, pStandard);
        return {
          company: item.company,
          day: item.day,
          promo: item.promo,
          priceNum: res.priceNum,
          priceStr: res.priceStr
        };
      });

      calculatedList.sort((a, b) => a.priceNum - b.priceNum);
      let top3 = calculatedList.slice(0, 3);

      const top3Container = document.getElementById("top3List");
      top3Container.innerHTML = "";

      top3.forEach((item, index) => {
        let div = document.createElement("div");
        div.className = "top3-item";
        div.innerHTML = `
          <div>
            <span class="top3-badge">No.${index + 1}</span>
            <strong>${item.company}</strong> ${item.day} - ${item.promo}
          </div>
          <div class="top3-price">$${item.priceStr}/L</div>
        `;
        top3Container.appendChild(div);
      });
    }

    function calculateAll() {
      let pPremium = parseFloat(document.getElementById("pPremium").value) || 30.09;
      let pStandard = parseFloat(document.getElementById("pStandard").value) || 28.29;

      renderTable("caltex-table", caltexPromos, "caltex", pPremium, pStandard);
      renderTable("shell-table", shellPromos, "shell", pPremium, pStandard);
      renderTable("esso-table", essoPromos, "esso", pPremium, pStandard);

      const allPromos = [...caltexPromos, ...shellPromos, ...essoPromos];
      updateTop3(allPromos, pPremium, pStandard);
    }

    async function fetchLatestOilPrice() {
      const btnText = document.getElementById("btnText");
      btnText.innerText = "更新中...";

      const targetUrl = "https://www.consumer.org.hk/pricewatch/oilwatch/opendata/oilprice.json";
      const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl);

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("HTTP error " + response.status);
        const data = await response.json();

        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        document.getElementById("versionDate").innerText = `${year}${month}${day}`;

        let premiumPrices = [];
        let standardPrices = [];

        if (Array.isArray(data)) {
          data.forEach(item => {
            let p = parseFloat(item.price);
            if (!isNaN(p) && p > 0) {
              if (item.type_zh && item.type_zh.includes("特級")) premiumPrices.push(p);
              else if (item.type_zh && (item.type_zh.includes("無鉛") || item.type_zh.includes("普通"))) standardPrices.push(p);
            }
          });
        }

        if (premiumPrices.length > 0) document.getElementById("pPremium").value = Math.max(...premiumPrices).toFixed(2);
        if (standardPrices.length > 0) document.getElementById("pStandard").value = Math.max(...standardPrices).toFixed(2);

        calculateAll();
        alert("✅ 油價與版本日期已成功更新！");
      } catch (error) {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        document.getElementById("versionDate").innerText = `${year}${month}${day}`;
        calculateAll();
        alert("✅ 版本日期已更新！(目前已是最新牌價)");
      } finally {
        btnText.innerText = "Refresh";
      }
    }

    calculateAll();
  </script>
</body>
</html>
