<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>香港三類油站折扣即時比價</title>
  
  <!-- iOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="油價比價">
  
  <style>
    :root {
      --primary: #007aff;
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --border: #e5e5ea;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: #1c1c1e;
    }

    .header {
      text-align: center;
      padding: 10px 0;
    }

    .header h1 {
      font-size: 20px;
      margin: 0;
    }

    .input-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-card label {
      font-size: 15px;
      font-weight: 600;
    }

    .input-card input {
      width: 100px;
      padding: 6px 10px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: right;
      background: #f9f9f9;
    }

    /* 由左至右水平滑動容器 */
    .brands-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .brand-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      flex: 0 0 85%; /* 手機畫面上可左右滑動切換 */
      max-width: 400px;
      scroll-snap-align: start;
      box-sizing: border-box;
    }

    @media (min-width: 768px) {
      .brand-card {
        flex: 1; /* 大螢幕/平板平分呈現 */
      }
    }

    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: bold;
    }

    .brand-caltex { color: #00838f; }
    .brand-shell { color: #d6a100; }
    .brand-esso { color: #e60012; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 6px 4px;
      text-align: center;
    }

    th {
      color: #8e8e93;
      font-weight: normal;
      border-bottom: 1px solid var(--border);
    }

    td.day {
      font-weight: 600;
      text-align: left;
      width: 25%;
    }

    td.promo {
      font-size: 11px;
      color: #666;
      text-align: left;
      width: 35%;
    }

    td.price {
      font-weight: bold;
      color: #30d158;
      width: 20%;
    }

    td.disc {
      color: #ff9500;
      width: 20%;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>⛽ 3大油站每日價錢比價</h1>
  </div>

  <div class="input-card">
    <label for="spending">目標入油金額 ($)</label>
    <input type="number" id="spending" value="500" step="50" oninput="calculateAll()">
  </div>

  <!-- 由左至右：Caltex ➔ Shell ➔ Esso -->
  <div class="brands-container">
    
    <!-- 1. Caltex (加德士) -->
    <div class="brand-card">
      <div class="brand-header">
        <span class="brand-title brand-caltex">🟢 Caltex 加德士</span>
        <span style="font-size: 11px; color: #666;">特級:$30.09 / 普通:$28.29</span>
      </div>
      <table>
        <thead>
          <tr>
            <th style="text-align: left;">星期/活動</th>
            <th style="text-align: left;">優惠方案</th>
            <th>折後每升</th>
            <th>每升總減</th>
          </tr>
        </thead>
        <tbody id="caltex-table"></tbody>
      </table>
    </div>

    <!-- 2. Shell (殼牌) -->
    <div class="brand-card">
      <div class="brand-header">
        <span class="brand-title brand-shell">🟡 Shell 殼牌</span>
        <span style="font-size: 11px; color: #666;">特級:$30.09 / 普通:$28.29</span>
      </div>
      <table>
        <thead>
          <tr>
            <th style="text-align: left;">星期/活動</th>
            <th style="text-align: left;">優惠方案</th>
            <th>折後每升</th>
            <th>每升總減</th>
          </tr>
        </thead>
        <tbody id="shell-table"></tbody>
      </table>
    </div>

    <!-- 3. Esso (埃索) -->
    <div class="brand-card">
      <div class="brand-header">
        <span class="brand-title brand-esso">🔴 Esso 埃索</span>
        <span style="font-size: 11px; color: #666;">特級:$30.09 / 普通:$28.29</span>
      </div>
      <table>
        <thead>
          <tr>
            <th style="text-align: left;">星期/活動</th>
            <th style="text-align: left;">優惠方案</th>
            <th>折後每升</th>
            <th>每升總減</th>
          </tr>
        </thead>
        <tbody id="esso-table"></tbody>
      </table>
    </div>

  </div>

  <script>
    const pPremium = 30.09;
    const pStandard = 28.29;

    const caltexPromos = [
      { day: "週一 / 四", promo: "直減 $6.0/L", disc: 6.00, gift: 0 },
      { day: "週二 / 五", promo: "免費升級 (免費升V-Power)", disc: 1.80, gift: 0, freeUpgrade: true },
      { day: "週三 / 六 / 日", promo: "直減 $7.2/L", disc: 7.20, gift: 0 },
      { day: "JoyFuel 卡", promo: "專屬卡直減 $8.0/L", disc: 8.00, gift: 0 }
    ];

    const shellPromos = [
      { day: "週一 / 四", promo: "直減 $5.0/L", disc: 5.00, gift: 0 },
      { day: "週二 / 五 / 日", promo: "直減 $7.0/L", disc: 7.00, gift: 0 },
      { day: "週三", promo: "免費升級", disc: 7.00, gift: 0, freeUpgrade: true },
      { day: "週六", promo: "直減 $7.0/L (3x積分)", disc: 7.00, gift: 0 },
      { day: "特別優惠", promo: "免費升級 + 直減 $7.6/L", disc: 7.60, gift: 0, freeUpgrade: true }
    ];

    const essoPromos = [
      { day: "週一 / 三", promo: "1000分換$268油", disc: 1.60, gift: 268, ptsRedeemed: 1000 },
      { day: "週二 / 五", promo: "直減 $8.5/L", disc: 8.50, gift: 0, ptsRedeemed: 0 },
      { day: "週四", promo: "免費升級", disc: 1.60, gift: 0, ptsRedeemed: 0, freeUpgrade: true },
      { day: "週六 / 日", promo: "Mastercard減$8/L (2x分)", disc: 9.80, gift: 0, ptsRedeemed: 0 },
      { day: "啟德/特別", promo: "滿$500送$200免費升級", disc: 1.60, gift: 200, ptsRedeemed: 0, freeUpgrade: true }
    ];

    function calcRow(item, spending) {
      let disc = item.disc;
      let giftedAmount = item.gift || 0;
      let ptsRedeemed = item.ptsRedeemed || 0;

      let volPaid = spending / (pPremium - disc);
      let volGift = 0;

      if (giftedAmount > 0) {
        volGift = giftedAmount / pStandard;
      } else if (item.freeUpgrade) {
        volGift = volPaid * ((pPremium - pStandard) / pStandard);
      }

      let totalVol = volPaid + volGift;
      let ptsValue = (ptsRedeemed / 1000) * 33.33;

      let finalPriceL = (spending + ptsValue) / totalVol;
      let totalDiscL = pPremium - finalPriceL;

      return {
        price: finalPriceL.toFixed(2),
        disc: totalDiscL.toFixed(2)
      };
    }

    function renderTable(tableId, dataList, spending) {
      const tbody = document.getElementById(tableId);
      tbody.innerHTML = "";
      dataList.forEach(item => {
        let res = calcRow(item, spending);
        let tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="day">${item.day}</td>
          <td class="promo">${item.promo}</td>
          <td class="price">$${res.price}</td>
          <td class="disc">-$${res.disc}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function calculateAll() {
      let spending = parseFloat(document.getElementById("spending").value) || 500;
      renderTable("caltex-table", caltexPromos, spending);
      renderTable("shell-table", shellPromos, spending);
      renderTable("esso-table", essoPromos, spending);
    }

    calculateAll();
  </script>
</body>
</html>
