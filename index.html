<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>香港三類油站折扣即時比價</title>
  
  <!-- iOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="油價比價">
  
  <style>
    :root {
      --primary: #007aff;
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --border: #e5e5ea;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: #1c1c1e;
    }

    .header {
      text-align: center;
      padding: 8px 0 4px 0;
    }

    .header h1 {
      font-size: 18px;
      margin: 0 0 4px 0;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 8px 12px;
      margin-top: 6px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .version-tag {
      font-size: 12px;
      color: #8e8e93;
      font-weight: 600;
    }

    .top-bar-btn {
      background-color: #e5e5ea;
      color: #1c1c1e;
      border: none;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    .top-bar-btn.primary {
      background-color: var(--primary);
      color: #fff;
    }

    /* 最平 3 個方案卡片 */
    .top3-card {
      background: #1c1c1e;
      color: #fff;
      border-radius: 12px;
      padding: 12px 10px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .top3-card h2 {
      font-size: 13px;
      color: #ffd60a;
      margin: 0 0 8px 0;
      text-align: center;
      border-bottom: 1px solid #38383a;
      padding-bottom: 4px;
    }

    .top3-grid {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .top3-col {
      flex: 1;
      background: #2c2c2e;
      border-radius: 8px;
      padding: 8px 6px;
      text-align: center;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top3-badge {
      font-weight: bold;
      font-size: 11px;
      padding: 2px 4px;
      border-radius: 4px;
      margin-bottom: 4px;
      display: inline-block;
    }

    .badge-1 { background: #ffd700; color: #000; }
    .badge-2 { background: #c0c0c0; color: #000; }
    .badge-3 { background: #cd7f32; color: #fff; }

    .top3-company { font-size: 12px; font-weight: bold; color: #fff; }
    .top3-day { font-size: 10px; color: #aaa; margin: 2px 0; }
    .top3-promo { font-size: 10px; color: #ddd; height: 26px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .top3-price { color: #30d158; font-weight: bold; font-size: 12px; margin-top: 4px; }
    .top3-pts-price { color: #ffd60a; font-size: 11px; }

    /* 水平滑動容器 */
    .brands-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .brand-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      flex: 0 0 95%;
      max-width: 480px;
      scroll-snap-align: start;
      box-sizing: border-box;
    }

    @media (min-width: 768px) {
      .brand-card { flex: 1; }
    }

    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .brand-title-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
    }

    .icon-caltex { background-color: #d32f2f; }
    .icon-shell { background-color: #ffd600; color: #000; }
    .icon-esso { background-color: #003399; }

    .brand-title {
      font-size: 16px;
      font-weight: bold;
    }

    .brand-caltex { color: #d32f2f; }
    .brand-shell { color: #d6a100; }
    .brand-esso { color: #003399; }

    .company-price-box {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border: 1px solid var(--border);
    }

    .company-price-box label {
      font-size: 12px;
      font-weight: 600;
      color: #555;
    }

    .company-price-box input {
      width: 65px;
      padding: 3px 5px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      text-align: right;
      background: #fff;
      font-weight: bold;
    }

    .edit-btn {
      background: #e5e5ea;
      color: #007aff;
      border: none;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .edit-btn.active {
      background: #ff9500;
      color: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th, td {
      padding: 6px 2px;
      text-align: center;
    }

    th {
      color: #8e8e93;
      font-weight: normal;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }

    tr.clickable-row {
      transition: background-color 0.15s;
    }

    tr.editable-mode {
      cursor: pointer;
      background-color: #f0f8ff;
      border: 1px dashed #007aff;
    }

    td.day { font-weight: 600; text-align: left; }
    td.promo { font-size: 11px; color: #555; text-align: left; }
    td.price { font-weight: bold; color: #30d158; }
    td.pts-price { font-weight: bold; color: #d6a100; }
    td.disc { color: #ff9500; font-weight: bold; font-size: 11px; }

    /* Modal 彈窗通用 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open { opacity: 1; pointer-events: auto; }

    .modal {
      background: #fff;
      width: 90%;
      max-width: 380px;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal h3 {
      margin-top: 0;
      margin-bottom: 14px;
      font-size: 16px;
      color: #000;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label { font-size: 12px; color: #666; font-weight: 600; }

    .form-group input[type="text"],
    .form-group input[type="number"] {
      padding: 8px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f9f9f9;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      margin-bottom: 14px;
    }

    .checkbox-group label { font-size: 14px; font-weight: 600; color: #333; }

    .modal-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .btn-cancel {
      background: #e5e5ea;
      color: #333;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .btn-save {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .btn-danger {
      background: #ff3b30;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
    }

    .history-item {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-info {
      font-size: 12px;
    }

    .history-time {
      font-weight: bold;
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>⛽ 3大油站每日價錢比價</h1>
  </div>

  <div class="top-bar">
    <button class="top-bar-btn" onclick="openHistoryModal()">📜 歷史紀錄</button>
    <div class="version-tag"><span id="versionDate">20261001</span></div>
    <button class="top-bar-btn primary" onclick="fetchLatestOilPrice()">
      🔄 <span id="btnText">Refresh</span>
    </button>
  </div>

  <div class="top3-card">
    <h2>🏆 最平 3 個入油方案 ($500 試算)</h2>
    <div class="top3-grid" id="top3Grid"></div>
  </div>

  <!-- 由左至右：Caltex ➔ Shell ➔ Esso -->
  <div class="brands-container">
    
    <!-- 1. Caltex -->
    <div class="brand-card">
      <div class="brand-header">
        <div class="brand-title-box">
          <span class="brand-icon icon-caltex">★</span>
          <span class="brand-title brand-caltex">Caltex 加德士</span>
        </div>
        <button class="edit-btn" id="btn-edit-caltex" onclick="toggleEditMode('caltex')">✏️ Edit</button>
      </div>
      <div class="company-price-box">
        <div><label>特級</label> <input type="number" id="caltex-pPremium" value="30.09" step="0.01" oninput="onOilPriceChange()"></div>
        <div><label>普通</label> <input type="number" id="caltex-pStandard" value="28.29" step="0.01" oninput="onOilPriceChange()"></div>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:20%; text-align:left;">日/活動</th>
            <th style="width:34%; text-align:left;">優惠方案</th>
            <th style="width:15%;">折後/L</th>
            <th style="width:15%;">連積分/L</th>
            <th style="width:16%;">連分總減</th>
          </tr>
        </thead>
        <tbody id="caltex-table"></tbody>
      </table>
    </div>

    <!-- 2. Shell -->
    <div class="brand-card">
      <div class="brand-header">
        <div class="brand-title-box">
          <span class="brand-icon icon-shell">🐚</span>
          <span class="brand-title brand-shell">Shell 殼牌</span>
        </div>
        <button class="edit-btn" id="btn-edit-shell" onclick="toggleEditMode('shell')">✏️ Edit</button>
      </div>
      <div class="company-price-box">
        <div><label>特級</label> <input type="number" id="shell-pPremium" value="30.09" step="0.01" oninput="onOilPriceChange()"></div>
        <div><label>普通</label> <input type="number" id="shell-pStandard" value="28.29" step="0.01" oninput="onOilPriceChange()"></div>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:20%; text-align:left;">日/活動</th>
            <th style="width:34%; text-align:left;">優惠方案</th>
            <th style="width:15%;">折後/L</th>
            <th style="width:15%;">連積分/L</th>
            <th style="width:16%;">連分總減</th>
          </tr>
        </thead>
        <tbody id="shell-table"></tbody>
      </table>
    </div>

    <!-- 3. Esso -->
    <div class="brand-card">
      <div class="brand-header">
        <div class="brand-title-box">
          <span class="brand-icon icon-esso">E</span>
          <span class="brand-title brand-esso">Esso 埃索</span>
        </div>
        <button class="edit-btn" id="btn-edit-esso" onclick="toggleEditMode('esso')">✏️ Edit</button>
      </div>
      <div class="company-price-box">
        <div><label>特級</label> <input type="number" id="esso-pPremium" value="30.09" step="0.01" oninput="onOilPriceChange()"></div>
        <div><label>普通</label> <input type="number" id="esso-pStandard" value="28.29" step="0.01" oninput="onOilPriceChange()"></div>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:20%; text-align:left;">日/活動</th>
            <th style="width:34%; text-align:left;">優惠方案</th>
            <th style="width:15%;">折後/L</th>
            <th style="width:15%;">連積分/L</th>
            <th style="width:16%;">連分總減</th>
          </tr>
        </thead>
        <tbody id="esso-table"></tbody>
      </table>
    </div>

  </div>

  <!-- Modal 1: 編輯方案 Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3 id="modalTitle">修改優惠方案</h3>
      <input type="hidden" id="modalItemId">
      <input type="hidden" id="modalBrand">

      <div class="form-group">
        <label>日 / 活動名稱</label>
        <input type="text" id="modalDay">
      </div>

      <div class="form-group">
        <label>優惠方案描述</label>
        <input type="text" id="modalPromo">
      </div>

      <div class="form-group">
        <label>每升直減金額 ($/L)</label>
        <input type="number" step="0.1" id="modalDisc">
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="modalFreeUpgrade" style="width:18px; height:18px;">
        <label for="modalFreeUpgrade">包含「免費升級」 (Free Upgrade)</label>
      </div>

      <div class="form-group" id="groupGift" style="display:none;">
        <label>滿額贈送金額 ($)</label>
        <input type="number" step="10" id="modalGift">
      </div>

      <div class="form-group">
        <label>積分倍數 (例如: 2 代表 2x 積分)</label>
        <input type="number" step="1" id="modalPtsMult" value="1">
      </div>

      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal('editModal')">取消</button>
        <button class="btn-save" onclick="saveModalData()">儲存更新</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: 歷史紀錄與版本控制 Modal -->
  <div class="modal-overlay" id="historyModal">
    <div class="modal">
      <h3>📜 歷史修改紀錄與版本備份</h3>
      
      <div style="margin-bottom: 12px; display:flex; gap:8px;">
        <button class="btn-save" style="flex:1; font-size:12px;" onclick="createBackupSnap()">💾 備份當前方案與油價</button>
        <button class="btn-danger" onclick="resetToDefaults()">↺ 重置為預設</button>
      </div>

      <div id="historyListContainer"></div>

      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal('historyModal')">關閉</button>
      </div>
    </div>
  </div>

  <script>
    const fixedSpending = 500;
    const isEditing = { caltex: false, shell: false, esso: false };

    // 初始預設資料
    const defaultCaltex = [
      { id: "c1", company: "加德士", day: "特別 1", promo: "JoyFuel 卡直減 $8.0/L", disc: 8.00, freeUpgrade: false, ptsMult: 1 },
      { id: "c2", company: "加德士", day: "特別 2", promo: "專屬活動減 $7.5/L", disc: 7.50, freeUpgrade: false, ptsMult: 1 },
      { id: "c3", company: "加德士", day: "星期一", promo: "直減 $6.0/L", disc: 6.00, freeUpgrade: false, ptsMult: 1 },
      { id: "c4", company: "加德士", day: "星期二", promo: "免費升級 (升V-Power)", disc: 1.80, freeUpgrade: true, ptsMult: 1 },
      { id: "c5", company: "加德士", day: "星期三", promo: "直減 $7.2/L", disc: 7.20, freeUpgrade: false, ptsMult: 1 },
      { id: "c6", company: "加德士", day: "星期四", promo: "直減 $6.0/L", disc: 6.00, freeUpgrade: false, ptsMult: 1 },
      { id: "c7", company: "加德士", day: "星期五", promo: "免費升級 (升V-Power)", disc: 1.80, freeUpgrade: true, ptsMult: 1 },
      { id: "c8", company: "加德士", day: "星期六", promo: "直減 $7.2/L", disc: 7.20, freeUpgrade: false, ptsMult: 1 },
      { id: "c9", company: "加德士", day: "星期日", promo: "直減 $7.2/L", disc: 7.20, freeUpgrade: false, ptsMult: 1 }
    ];

    const defaultShell = [
      { id: "s1", company: "Shell", day: "特別 1", promo: "免費升級 + 直減 $7.6/L (3x分)", disc: 7.60, freeUpgrade: true, ptsMult: 3 },
      { id: "s2", company: "Shell", day: "特別 2", promo: "特別推廣減 $7.0/L", disc: 7.00, freeUpgrade: false, ptsMult: 1 },
      { id: "s3", company: "Shell", day: "星期一", promo: "直減 $5.0/L", disc: 5.00, freeUpgrade: false, ptsMult: 1 },
      { id: "s4", company: "Shell", day: "星期二", promo: "直減 $7.0/L", disc: 7.00, freeUpgrade: false, ptsMult: 1 },
      { id: "s5", company: "Shell", day: "星期三", promo: "免費升級", disc: 7.00, freeUpgrade: true, ptsMult: 1 },
      { id: "s6", company: "Shell", day: "星期四", promo: "直減 $5.0/L", disc: 5.00, freeUpgrade: false, ptsMult: 1 },
      { id: "s7", company: "Shell", day: "星期五", promo: "直減 $7.0/L", disc: 7.00, freeUpgrade: false, ptsMult: 1 },
      { id: "s8", company: "Shell", day: "星期六", promo: "直減 $7.0/L (3x積分)", disc: 7.00, freeUpgrade: false, ptsMult: 3 },
      { id: "s9", company: "Shell", day: "星期日", promo: "直減 $7.0/L", disc: 7.00, freeUpgrade: false, ptsMult: 1 }
    ];

    const defaultEsso = [
      { id: "e1", company: "Esso", day: "特別 1", promo: "滿$500送$200油券", disc: 1.60, gift: 200, ptsRedeemed: 0, freeUpgrade: false, ptsMult: 1 },
      { id: "e2", company: "Esso", day: "特別 2", promo: "滿$500送$200免費升級", disc: 1.60, gift: 200, ptsRedeemed: 0, freeUpgrade: true, ptsMult: 1 },
      { id: "e3", company: "Esso", day: "星期一", promo: "1000分換$268油", disc: 1.60, gift: 268, ptsRedeemed: 1000, freeUpgrade: false, ptsMult: 1 },
      { id: "e4", company: "Esso", day: "星期二", promo: "直減 $8.5/L", disc: 8.50, gift: 0, ptsRedeemed: 0, freeUpgrade: false, ptsMult: 1 },
      { id: "e5", company: "Esso", day: "星期三", promo: "1000分換$268油", disc: 1.60, gift: 268, ptsRedeemed: 1000, freeUpgrade: false, ptsMult: 1 },
      { id: "e6", company: "Esso", day: "星期四", promo: "免費升級", disc: 1.60, gift: 0, ptsRedeemed: 0, freeUpgrade: true, ptsMult: 1 },
      { id: "e7", company: "Esso", day: "星期五", promo: "直減 $8.5/L", disc: 8.50, gift: 0, ptsRedeemed: 0, freeUpgrade: false, ptsMult: 1 },
      { id: "e8", company: "Esso", day: "星期六", promo: "Mastercard減$8/L (2x分)", disc: 9.80, gift: 0, ptsRedeemed: 0, freeUpgrade: false, ptsMult: 2 },
      { id: "e9", company: "Esso", day: "星期日", promo: "Mastercard減$8/L (2x分)", disc: 9.80, gift: 0, ptsRedeemed: 0, freeUpgrade: false, ptsMult: 2 }
    ];

    const defaultOilPrices = {
      caltex: { pPremium: "30.09", pStandard: "28.29" },
      shell: { pPremium: "30.09", pStandard: "28.29" },
      esso: { pPremium: "30.09", pStandard: "28.29" }
    };

    // 初始化載入數據
    let caltexPromos = JSON.parse(localStorage.getItem("caltexPromos")) || defaultCaltex;
    let shellPromos = JSON.parse(localStorage.getItem("shellPromos")) || defaultShell;
    let essoPromos = JSON.parse(localStorage.getItem("essoPromos")) || defaultEsso;
    let savedOilPrices = JSON.parse(localStorage.getItem("savedOilPrices")) || defaultOilPrices;
    let historySnapshots = JSON.parse(localStorage.getItem("oilHistorySnapshots")) || [];

    // 將優惠方案與當前輸入的油價一同持久化保存至 localStorage
    function saveToLocalStorage() {
      localStorage.setItem("caltexPromos", JSON.stringify(caltexPromos));
      localStorage.setItem("shellPromos", JSON.stringify(shellPromos));
      localStorage.setItem("essoPromos", JSON.stringify(essoPromos));

      const currentPrices = {
        caltex: {
          pPremium: document.getElementById("caltex-pPremium").value,
          pStandard: document.getElementById("caltex-pStandard").value
        },
        shell: {
          pPremium: document.getElementById("shell-pPremium").value,
          pStandard: document.getElementById("shell-pStandard").value
        },
        esso: {
          pPremium: document.getElementById("esso-pPremium").value,
          pStandard: document.getElementById("esso-pStandard").value
        }
      };
      localStorage.setItem("savedOilPrices", JSON.stringify(currentPrices));
    }

    // 載入 localStorage 保存的油價至 UI
    function loadSavedOilPricesUI() {
      if (savedOilPrices.caltex) {
        document.getElementById("caltex-pPremium").value = savedOilPrices.caltex.pPremium;
        document.getElementById("caltex-pStandard").value = savedOilPrices.caltex.pStandard;
      }
      if (savedOilPrices.shell) {
        document.getElementById("shell-pPremium").value = savedOilPrices.shell.pPremium;
        document.getElementById("shell-pStandard").value = savedOilPrices.shell.pStandard;
      }
      if (savedOilPrices.esso) {
        document.getElementById("esso-pPremium").value = savedOilPrices.esso.pPremium;
        document.getElementById("esso-pStandard").value = savedOilPrices.esso.pStandard;
      }
    }

    function onOilPriceChange() {
      saveToLocalStorage();
      calculateAll();
    }

    function calcItem(item, pPremium, pStandard) {
      let disc = item.disc || 0;
      let giftedAmount = item.gift || 0;
      let ptsRedeemed = item.ptsRedeemed || 0;
      let ptsMult = item.ptsMult || 1;

      let volPaid = fixedSpending / Math.max(0.1, pPremium - disc);
      let volGift = 0;

      if (giftedAmount > 0) volGift = giftedAmount / pStandard;
      if (item.freeUpgrade) volGift += volPaid * ((pPremium - pStandard) / pStandard);

      let totalVol = volPaid + volGift;
      let ptsValueUsed = (ptsRedeemed / 1000) * 33.33;

      let finalPriceL = (fixedSpending + ptsValueUsed) / totalVol;
      let ptsEarned = volPaid * 15 * ptsMult;
      let ptsEarnedVal = (ptsEarned / 1000) * 33.33;

      let finalPtsPriceL = (fixedSpending + ptsValueUsed - ptsEarnedVal) / totalVol;
      let ptsTotalDiscountL = pPremium - finalPtsPriceL;

      return {
        priceNum: finalPriceL,
        priceStr: finalPriceL.toFixed(2),
        ptsPriceNum: finalPtsPriceL,
        ptsPriceStr: finalPtsPriceL.toFixed(2),
        ptsDiscStr: ptsTotalDiscountL.toFixed(2)
      };
    }

    function toggleEditMode(brandKey) {
      isEditing[brandKey] = !isEditing[brandKey];
      const btn = document.getElementById(`btn-edit-${brandKey}`);
      if (isEditing[brandKey]) {
        btn.innerText = "Done";
        btn.classList.add("active");
      } else {
        btn.innerText = "✏️ Edit";
        btn.classList.remove("active");
      }
      calculateAll();
    }

    function openModal(modalId) {
      document.getElementById(modalId).classList.add("open");
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove("open");
    }

    function openEditRowModal(brandKey, itemId) {
      if (!isEditing[brandKey]) return;

      let list = brandKey === 'caltex' ? caltexPromos : (brandKey === 'shell' ? shellPromos : essoPromos);
      let item = list.find(x => x.id === itemId);
      if (!item) return;

      document.getElementById("modalItemId").value = item.id;
      document.getElementById("modalBrand").value = brandKey;
      document.getElementById("modalDay").value = item.day;
      document.getElementById("modalPromo").value = item.promo;
      document.getElementById("modalDisc").value = item.disc;
      document.getElementById("modalFreeUpgrade").checked = item.freeUpgrade || false;
      document.getElementById("modalPtsMult").value = item.ptsMult || 1;

      const groupGift = document.getElementById("groupGift");
      if (brandKey === "esso") {
        groupGift.style.display = "flex";
        document.getElementById("modalGift").value = item.gift || 0;
      } else {
        groupGift.style.display = "none";
      }

      openModal("editModal");
    }

    function saveModalData() {
      const itemId = document.getElementById("modalItemId").value;
      const brandKey = document.getElementById("modalBrand").value;

      let list = brandKey === 'caltex' ? caltexPromos : (brandKey === 'shell' ? shellPromos : essoPromos);
      let item = list.find(x => x.id === itemId);

      if (item) {
        item.day = document.getElementById("modalDay").value;
        item.promo = document.getElementById("modalPromo").value;
        item.disc = parseFloat(document.getElementById("modalDisc").value) || 0;
        item.freeUpgrade = document.getElementById("modalFreeUpgrade").checked;
        item.ptsMult = parseFloat(document.getElementById("modalPtsMult").value) || 1;
        if (brandKey === "esso") {
          item.gift = parseFloat(document.getElementById("modalGift").value) || 0;
        }
      }

      saveToLocalStorage();
      closeModal('editModal');
      calculateAll();
    }

    /* 歷史快照備份與恢復功能 (包含油價) */
    function openHistoryModal() {
      renderHistoryList();
      openModal("historyModal");
    }

    function createBackupSnap() {
      const now = new Date();
      const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      
      const currentPrices = {
        caltex: {
          pPremium: document.getElementById("caltex-pPremium").value,
          pStandard: document.getElementById("caltex-pStandard").value
        },
        shell: {
          pPremium: document.getElementById("shell-pPremium").value,
          pStandard: document.getElementById("shell-pStandard").value
        },
        esso: {
          pPremium: document.getElementById("esso-pPremium").value,
          pStandard: document.getElementById("esso-pStandard").value
        }
      };

      const snap = {
        id: Date.now(),
        time: timeStr,
        prices: currentPrices,
        caltex: JSON.parse(JSON.stringify(caltexPromos)),
        shell: JSON.parse(JSON.stringify(shellPromos)),
        esso: JSON.parse(JSON.stringify(essoPromos))
      };

      historySnapshots.unshift(snap);
      if (historySnapshots.length > 10) historySnapshots.pop();

      localStorage.setItem("oilHistorySnapshots", JSON.stringify(historySnapshots));
      renderHistoryList();
      alert("✅ 已成功備份當前優惠方案與各站油價！");
    }

    function restoreSnapshot(snapId) {
      const snap = historySnapshots.find(x => x.id === snapId);
      if (!snap) return;

      if (confirm(`確定要還原至 ${snap.time} 的備份方案與油價嗎？`)) {
        caltexPromos = JSON.parse(JSON.stringify(snap.caltex));
        shellPromos = JSON.parse(JSON.stringify(snap.shell));
        essoPromos = JSON.parse(JSON.stringify(snap.esso));

        if (snap.prices) {
          savedOilPrices = JSON.parse(JSON.stringify(snap.prices));
          loadSavedOilPricesUI();
        }

        saveToLocalStorage();
        calculateAll();
        closeModal("historyModal");
        alert("✅ 已還原歷史備份方案與油價！");
      }
    }

    function resetToDefaults() {
      if (confirm("確定要把所有優惠方案與油價恢復為初始預設值嗎？")) {
        caltexPromos = JSON.parse(JSON.stringify(defaultCaltex));
        shellPromos = JSON.parse(JSON.stringify(defaultShell));
        essoPromos = JSON.parse(JSON.stringify(defaultEsso));
        savedOilPrices = JSON.parse(JSON.stringify(defaultOilPrices));

        loadSavedOilPricesUI();
        saveToLocalStorage();
        calculateAll();
        closeModal("historyModal");
        alert("✅ 已恢復初始預設值！");
      }
    }

    function renderHistoryList() {
      const container = document.getElementById("historyListContainer");
      container.innerHTML = "";

      if (historySnapshots.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:#8e8e93; font-size:12px; padding:12px;">尚無歷史快照，點擊上方按鈕備份。</div>`;
        return;
      }

      historySnapshots.forEach(snap => {
        let div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `
          <div class="history-info">
            <div class="history-time">📅 ${snap.time}</div>
            <div style="color:#666;">備份 (含特級/普通油價與3大油站方案)</div>
          </div>
          <button class="btn-save" style="font-size:11px; padding:4px 8px;" onclick="restoreSnapshot(${snap.id})">↩️ 恢復</button>
        `;
        container.appendChild(div);
      });
    }

    function renderTable(tableId, dataList, brandKey, pPremium, pStandard) {
      const tbody = document.getElementById(tableId);
      tbody.innerHTML = "";
      const editable = isEditing[brandKey];

      dataList.forEach(item => {
        let res = calcItem(item, pPremium, pStandard);
        let tr = document.createElement("tr");
        
        tr.className = "clickable-row" + (editable ? " editable-mode" : "");
        if (editable) {
          tr.onclick = () => openEditRowModal(brandKey, item.id);
        }

        tr.innerHTML = `
          <td class="day">${item.day} ${editable ? "✏️" : ""}</td>
          <td class="promo">${item.promo}</td>
          <td class="price">$${res.priceStr}</td>
          <td class="pts-price">$${res.ptsPriceStr}</td>
          <td class="disc">-$${res.ptsDiscStr}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateTop3(allPromosWithPrices) {
      let calculatedList = [];

      allPromosWithPrices.forEach(group => {
        group.promos.forEach(item => {
          let res = calcItem(item, group.pPremium, group.pStandard);
          calculatedList.push({
            company: item.company,
            day: item.day,
            promo: item.promo,
            priceNum: res.priceNum,
            priceStr: res.priceStr,
            ptsPriceStr: res.ptsPriceStr
          });
        });
      });

      calculatedList.sort((a, b) => a.priceNum - b.priceNum);
      let top3 = calculatedList.slice(0, 3);

      const top3Container = document.getElementById("top3Grid");
      top3Container.innerHTML = "";

      const badges = ["badge-1", "badge-2", "badge-3"];
      const badgeTexts = ["No.1 金", "No.2 銀", "No.3 銅"];

      top3.forEach((item, index) => {
        let div = document.createElement("div");
        div.className = "top3-col";
        div.innerHTML = `
          <div>
            <span class="top3-badge ${badges[index]}">${badgeTexts[index]}</span>
            <div class="top3-company">${item.company}</div>
            <div class="top3-day">${item.day}</div>
            <div class="top3-promo">${item.promo}</div>
          </div>
          <div>
            <div class="top3-price">$${item.priceStr}/L</div>
            <div class="top3-pts-price">連分:$${item.ptsPriceStr}</div>
          </div>
        `;
        top3Container.appendChild(div);
      });
    }

    function calculateAll() {
      let cPremium = parseFloat(document.getElementById("caltex-pPremium").value) || 30.09;
      let cStandard = parseFloat(document.getElementById("caltex-pStandard").value) || 28.29;

      let sPremium = parseFloat(document.getElementById("shell-pPremium").value) || 30.09;
      let sStandard = parseFloat(document.getElementById("shell-pStandard").value) || 28.29;

      let ePremium = parseFloat(document.getElementById("esso-pPremium").value) || 30.09;
      let eStandard = parseFloat(document.getElementById("esso-pStandard").value) || 28.29;

      renderTable("caltex-table", caltexPromos, "caltex", cPremium, cStandard);
      renderTable("shell-table", shellPromos, "shell", sPremium, sStandard);
      renderTable("esso-table", essoPromos, "esso", ePremium, eStandard);

      const allPromosWithPrices = [
        { promos: caltexPromos, pPremium: cPremium, pStandard: cStandard },
        { promos: shellPromos, pPremium: sPremium, pStandard: sStandard },
        { promos: essoPromos, pPremium: ePremium, pStandard: eStandard }
      ];

      updateTop3(allPromosWithPrices);
    }

    async function fetchLatestOilPrice() {
      const btnText = document.getElementById("btnText");
      btnText.innerText = "更新中...";

      const targetUrl = "https://www.consumer.org.hk/pricewatch/oilwatch/opendata/oilprice.json";
      const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl);

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("HTTP error " + response.status);
        const data = await response.json();

        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        document.getElementById("versionDate").innerText = `${year}${month}${day}`;

        let pPrices = [], sPrices = [];
        if (Array.isArray(data)) {
          data.forEach(item => {
            let p = parseFloat(item.price);
            if (!isNaN(p) && p > 0) {
              if (item.type_zh && item.type_zh.includes("特級")) pPrices.push(p);
              else if (item.type_zh && (item.type_zh.includes("無鉛") || item.type_zh.includes("普通"))) sPrices.push(p);
            }
          });
        }

        if (pPrices.length > 0) {
          let maxP = Math.max(...pPrices).toFixed(2);
          document.getElementById("caltex-pPremium").value = maxP;
          document.getElementById("shell-pPremium").value = maxP;
          document.getElementById("esso-pPremium").value = maxP;
        }

        if (sPrices.length > 0) {
          let maxS = Math.max(...sPrices).toFixed(2);
          document.getElementById("caltex-pStandard").value = maxS;
          document.getElementById("shell-pStandard").value = maxS;
          document.getElementById("esso-pStandard").value = maxS;
        }

        saveToLocalStorage();
        calculateAll();
        alert("✅ 各油站牌價與版本日期已成功更新！");
      } catch (error) {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        document.getElementById("versionDate").innerText = `${year}${month}${day}`;
        saveToLocalStorage();
        calculateAll();
        alert("✅ 版本日期已更新！(目前已是最新牌價)");
      } finally {
        btnText.innerText = "Refresh";
      }
    }

    // 啟動頁面時載入 UI
    loadSavedOilPricesUI();
    calculateAll();
  </script>
</body>
