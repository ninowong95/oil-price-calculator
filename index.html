<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>香港三類油站折扣即時比價</title>
  
  <!-- iOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="油價比價">
  
  <style>
    :root {
      --primary: #007aff;
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --border: #e5e5ea;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: #1c1c1e;
    }

    .header {
      text-align: center;
      padding: 8px 0 4px 0;
    }

    .header h1 {
      font-size: 18px;
      margin: 0 0 4px 0;
    }

    /* 版本日期欄位 */
    .version-tag {
      font-size: 12px;
      color: #8e8e93;
      font-weight: 500;
    }

    /* 頂部油價與 Refresh 按鈕卡片 */
    .prices-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 10px 14px;
      margin-top: 6px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .price-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .price-group label {
      font-size: 13px;
      font-weight: 600;
    }

    .price-group input {
      width: 70px;
      padding: 4px 6px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      text-align: right;
      background: #f9f9f9;
      font-weight: bold;
    }

    .refresh-btn {
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .refresh-btn:active {
      opacity: 0.8;
    }

    /* 最平 3 個方案卡片 */
    .top3-card {
      background: #1c1c1e;
      color: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .top3-card h2 {
      font-size: 14px;
      color: #ffd60a;
      margin: 0 0 8px 0;
      border-bottom: 1px solid #38383a;
      padding-bottom: 4px;
    }

    .top3-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 13px;
    }

    .top3-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .top3-item:last-child {
      margin-bottom: 0;
    }

    .top3-badge {
      background: #30d158;
      color: #000;
      font-weight: bold;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 6px;
    }

    .top3-price {
      color: #30d158;
      font-weight: bold;
    }

    /* 水平滑動容器 */
    .brands-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .brand-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      flex: 0 0 88%;
      max-width: 420px;
      scroll-snap-align: start;
      box-sizing: border-box;
    }

    @media (min-width: 768px) {
      .brand-card {
        flex: 1;
      }
    }

    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: bold;
    }

    .brand-caltex { color: #00838f; }
    .brand-shell { color: #d6a100; }
    .brand-esso { color: #e60012; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 6px 4px;
      text-align: center;
    }

    th {
      color: #8e8e93;
      font-weight: normal;
      border-bottom: 1px solid var(--border);
    }

    td.day {
      font-weight: 600;
      text-align: left;
      width: 24%;
    }

    td.promo {
      font-size: 11px;
      color: #666;
      text-align: left;
      width: 38%;
    }

    td.price {
      font-weight: bold;
      color: #30d158;
      width: 19%;
    }

    td.disc {
      color: #ff9500;
      width: 19%;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>⛽ 3大油站每日價錢比價</h1>
    <!-- 版本日期標籤 -->
    <div class="version-tag">版本日期: <span id="versionDate">20260929</span></div>
  </div>

  <!-- 頂部油價與 Refresh 按鈕 -->
  <div class="prices-card">
    <div class="price-group">
      <label for="pPremium">特級</label>
      <input type="number" id="pPremium" value="30.09" step="0.01" oninput="calculateAll()">
    </div>
    <div class="price-group">
      <label for="pStandard">普通</label>
      <input type="number" id="pStandard" value="28.29" step="0.01" oninput="calculateAll()">
    </div>
    <button class="refresh-btn" onclick="fetchLatestOilPrice()">
      🔄 <span>Refresh</span>
    </button>
  </div>

  <!-- 最平 3 個入油方案 -->
  <div class="top3-card">
    <h2>🏆 最平 3 個入油方案</h2>
    <div class="top3-list" id="top3List"></div>
  </div>

  <!-- 由左至右：Caltex ➔ Shell ➔ Esso -->
  <div class="brands-container">
    
    <!-- 1. Caltex (加德士) -->
    <div class="brand-card">
      <div class="brand-header">
        <span class="brand-title brand-caltex">🟢 Caltex 加德士</span>
      </div>
      <table>
        <thead>
          <tr>
            <th style="text-align: left;">日/活動</th>
            <th style="text-align: left;">優惠方案</th>
            <th>折後每升</th>
            <th>每升總減</th>
          </tr>
        </thead>
        <tbody id="caltex-table"></tbody>
      </table>
    </div>

    <!-- 2. Shell (殼牌) -->
    <div class="brand-card">
      <div class="brand-header">
        <span class="brand-title brand-shell">🟡 Shell 殼牌</span>
      </div>
      <table>
        <thead>
          <tr>
            <th style="text-align: left;">日/活動</th>
            <th style="text-align: left;">優惠方案</th>
            <th>折後每升</th>
            <th>每升總減</th>
          </tr>
        </thead>
        <tbody id="shell-table"></tbody>
      </table>
    </div>

    <!-- 3. Esso (埃索) -->
    <div class="brand-card">
      <div class="brand-header">
        <span class="brand-title brand-esso">🔴 Esso 埃索</span>
      </div>
      <table>
        <thead>
          <tr>
            <th style="text-align: left;">日/活動</th>
            <th style="text-align: left;">優惠方案</th>
            <th>折後每升</th>
            <th>每升總減</th>
          </tr>
        </thead>
        <tbody id="esso-table"></tbody>
      </table>
    </div>

  </div>

  <script>
    const fixedSpending = 500;

    const caltexPromos = [
      { company: "加德士", day: "特別 1", promo: "JoyFuel 卡直減 $8.0/L", disc: 8.00 },
      { company: "加德士", day: "特別 2", promo: "專屬活動減 $7.5/L", disc: 7.50 },
      { company: "加德士", day: "星期一", promo: "直減 $6.0/L", disc: 6.00 },
      { company: "加德士", day: "星期二", promo: "免費升級 (免費升V-Power)", disc: 1.80, freeUpgrade: true },
      { company: "加德士", day: "星期三", promo: "直減 $7.2/L", disc: 7.20 },
      { company: "加德士", day: "星期四", promo: "直減 $6.0/L", disc: 6.00 },
      { company: "加德士", day: "星期五", promo: "免費升級 (免費升V-Power)", disc: 1.80, freeUpgrade: true },
      { company: "加德士", day: "星期六", promo: "直減 $7.2/L", disc: 7.20 },
      { company: "加德士", day: "星期日", promo: "直減 $7.2/L", disc: 7.20 }
    ];

    const shellPromos = [
      { company: "Shell", day: "特別 1", promo: "免費升級 + 直減 $7.6/L (3x分)", disc: 7.60, freeUpgrade: true },
      { company: "Shell", day: "特別 2", promo: "特別推廣減 $7.0/L", disc: 7.00 },
      { company: "Shell", day: "星期一", promo: "直減 $5.0/L", disc: 5.00 },
      { company: "Shell", day: "星期二", promo: "直減 $7.0/L", disc: 7.00 },
      { company: "Shell", day: "星期三", promo: "免費升級", disc: 7.00, freeUpgrade: true },
      { company: "Shell", day: "星期四", promo: "直減 $5.0/L", disc: 5.00 },
      { company: "Shell", day: "星期五", promo: "直減 $7.0/L", disc: 7.00 },
      { company: "Shell", day: "星期六", promo: "直減 $7.0/L (3x積分)", disc: 7.00 },
      { company: "Shell", day: "星期日", promo: "直減 $7.0/L", disc: 7.00 }
    ];

    const essoPromos = [
      { company: "Esso", day: "特別 1", promo: "滿$500送$200油券", disc: 1.60, gift: 200 },
      { company: "Esso", day: "特別 2", promo: "滿$500送$200免費升級", disc: 1.60, gift: 200, freeUpgrade: true },
      { company: "Esso", day: "星期一", promo: "1000分換$268油", disc: 1.60, gift: 268, ptsRedeemed: 1000 },
      { company: "Esso", day: "星期二", promo: "直減 $8.5/L", disc: 8.50 },
      { company: "Esso", day: "星期三", promo: "1000分換$268油", disc: 1.60, gift: 268, ptsRedeemed: 1000 },
      { company: "Esso", day: "星期四", promo: "免費升級", disc: 1.60, freeUpgrade: true },
      { company: "Esso", day: "星期五", promo: "直減 $8.5/L", disc: 8.50 },
      { company: "Esso", day: "星期六", promo: "Mastercard減$8/L (2x分)", disc: 9.80 },
      { company: "Esso", day: "星期日", promo: "Mastercard減$8/L (2x分)", disc: 9.80 }
    ];

    function calcRow(item, pPremium, pStandard) {
      let disc = item.disc;
      let giftedAmount = item.gift || 0;
      let ptsRedeemed = item.ptsRedeemed || 0;

      let volPaid = fixedSpending / (pPremium - disc);
      let volGift = 0;

      if (giftedAmount > 0) {
        volGift = giftedAmount / pStandard;
      } else if (item.freeUpgrade) {
        volGift = volPaid * ((pPremium - pStandard) / pStandard);
      }

      let totalVol = volPaid + volGift;
      let ptsValue = (ptsRedeemed / 1000) * 33.33;

      let finalPriceL = (fixedSpending + ptsValue) / totalVol;
      let totalDiscL = pPremium - finalPriceL;

      return {
        priceNum: finalPriceL,
        priceStr: finalPriceL.toFixed(2),
        discStr: totalDiscL.toFixed(2)
      };
    }

    function renderTable(tableId, dataList, pPremium, pStandard) {
      const tbody = document.getElementById(tableId);
      tbody.innerHTML = "";
      dataList.forEach(item => {
        let res = calcRow(item, pPremium, pStandard);
        let tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="day">${item.day}</td>
          <td class="promo">${item.promo}</td>
          <td class="price">$${res.priceStr}</td>
          <td class="disc">-$${res.discStr}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateTop3(allPromos, pPremium, pStandard) {
      // 算出所有方案的折後價並進行排序
      let calculatedList = allPromos.map(item => {
        let res = calcRow(item, pPremium, pStandard);
        return {
          company: item.company,
          day: item.day,
          promo: item.promo,
          priceNum: res.priceNum,
          priceStr: res.priceStr
        };
      });

      calculatedList.sort((a, b) => a.priceNum - b.priceNum);

      let top3 = calculatedList.slice(0, 3);
      const top3Container = document.getElementById("top3List");
      top3Container.innerHTML = "";

      top3.forEach((item, index) => {
        let div = document.createElement("div");
        div.className = "top3-item";
        div.innerHTML = `
          <div>
            <span class="top3-badge">No.${index + 1}</span>
            <strong>${item.company}</strong> ${item.day} - ${item.promo}
          </div>
          <div class="top3-price">$${item.priceStr}/L</div>
        `;
        top3Container.appendChild(div);
      });
    }

    function calculateAll() {
      let pPremium = parseFloat(document.getElementById("pPremium").value) || 30.09;
      let pStandard = parseFloat(document.getElementById("pStandard").value) || 28.29;

      renderTable("caltex-table", caltexPromos, pPremium, pStandard);
      renderTable("shell-table", shellPromos, pPremium, pStandard);
      renderTable("esso-table", essoPromos, pPremium, pStandard);

      const allPromos = [...caltexPromos, ...shellPromos, ...essoPromos];
      updateTop3(allPromos, pPremium, pStandard);
    }

    // Refresh 按鈕向消委會 API 請求最新油價
    async function fetchLatestOilPrice() {
      const btn = document.querySelector(".refresh-btn span");
      btn.innerText = "更新中...";
      
      try {
        const response = await fetch("https://www.consumer.org.hk/pricewatch/oilwatch/opendata/oilprice.json");
        const data = await response.json();

        // 格式化當前日期為 YYYYMMDD
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        document.getElementById("versionDate").innerText = `${year}${month}${day}`;

        // 嘗試讀取 API 內的油價
        if (data && Array.isArray(data)) {
          let foundPremium = null;
          let foundStandard = null;

          data.forEach(item => {
            if (item.type_zh === "特級汽油" || item.type_en === "Premium Petrol") {
              foundPremium = item.price;
            }
            if (item.type_zh === "無鉛汽油" || item.type_en === "Unleaded Petrol") {
              foundStandard = item.price;
            }
          });

          if (foundPremium) document.getElementById("pPremium").value = foundPremium;
          if (foundStandard) document.getElementById("pStandard").value = foundStandard;
        }

        calculateAll();
        alert("已成功更新最新油價！");
      } catch (error) {
        console.log("Fetch error:", error);
        // 若遭 CORS 擋下，更新日期並重新計算
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        document.getElementById("versionDate").innerText = `${year}${month}${day}`;
        calculateAll();
        alert("已更新版本日期！(API 連線受限，保留目前油價設定)");
      } finally {
        btn.innerText = "Refresh";
      }
    }

    calculateAll();
  </script>
</body>
</html>
