<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>香港油價折扣計算器</title>
  
  <!-- iOS PWA 支援 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="油價計算器">
  
  <style>
    :root {
      --primary: #007aff;
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --border: #e5e5ea;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background-color: var(--bg);
      color: #000;
    }

    .header {
      text-align: center;
      padding: 12px 0;
    }

    .header h1 {
      font-size: 20px;
      margin: 0;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .card h2 {
      font-size: 15px;
      margin: 0 0 10px 0;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .row label {
      flex: 1;
      color: #3a3a3c;
    }

    .row input, .row select {
      width: 130px;
      padding: 6px 8px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: right;
      background: #f9f9f9;
    }

    .result-card {
      background: #1c1c1e;
      color: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .result-card h2 {
      color: #5ea9ff;
      border-bottom: 1px solid #38383a;
      margin-top: 0;
    }

    .res-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .res-row.highlight {
      font-size: 17px;
      font-weight: bold;
      color: #30d158;
      border-top: 1px dashed #38383a;
      padding-top: 8px;
      margin-top: 8px;
    }

    .res-row.sub-highlight {
      font-size: 15px;
      font-weight: bold;
      color: #ffd60a;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>⛽ 油價折扣計算器 (Oil Calculator)</h1>
  </div>

  <!-- 計算結果展示區域 -->
  <div class="result-card">
    <h2>📊 計算結果</h2>
    <div class="res-row">
      <span>實質入油量 (Total Volume):</span>
      <span id="res-vol">0.00 L</span>
    </div>
    <div class="res-row">
      <span>(付費: <span id="res-vol-paid">0.00</span>L / 贈送: <span id="res-vol-gift">0.00</span>L)</span>
    </div>
    <div class="res-row highlight">
      <span>優惠後每升牌價:</span>
      <span id="res-price-l">$0.00 / L</span>
    </div>
    <div class="res-row">
      <span>每升折扣金額:</span>
      <span id="res-disc-l">$0.00 / L</span>
    </div>
    <div class="res-row sub-highlight">
      <span>扣除積分後每升淨價:</span>
      <span id="res-price-pts">$0.00 / L</span>
    </div>
    <div class="res-row">
      <span>扣除積分後總每升折扣:</span>
      <span id="res-disc-pts">$0.00 / L</span>
    </div>
    <div class="res-row" style="margin-top: 8px; border-top: 1px solid #38383a; padding-top: 8px;">
      <span>賺取積分 (Points Earned):</span>
      <span id="res-pts-earned" style="color: #64d2ff;">0 pts</span>
    </div>
  </div>

  <!-- 油站與油價設定 -->
  <div class="card">
    <h2>1. 油站與油價設定</h2>
    <div class="row">
      <label>油站品牌</label>
      <select id="brand" onchange="updateOptions()">
        <option value="Esso">Esso</option>
        <option value="Shell">Shell</option>
      </select>
    </div>
    <div class="row">
      <label>特級汽油 (Premium Price)</label>
      <input type="number" id="pricePremium" value="30.09" step="0.01" oninput="calculate()">
    </div>
    <div class="row">
      <label>普通汽油 (Standard Price)</label>
      <input type="number" id="priceStandard" value="28.29" step="0.01" oninput="calculate()">
    </div>
  </div>

  <!-- 優惠方案與消費金額 -->
  <div class="card">
    <h2>2. 優惠方案設定</h2>
    <div class="row">
      <label>優惠活動模式</label>
      <select id="promoPreset" onchange="applyPreset()">
        <option value="custom">自訂優惠</option>
        <option value="esso_mon">Esso 週一/三 (1000分換$268油)</option>
        <option value="esso_tue">Esso 週二/五 (直減 $8.5/L)</option>
        <option value="esso_sat">Esso 週六/日 (Mastercard $8/L 2x分)</option>
        <option value="shell_mon">Shell 週一/四 (直減 $5.0/L)</option>
        <option value="shell_tue">Shell 週二/五 (直減 $7.0/L)</option>
        <option value="shell_sat">Shell 週六 (直減 $7.0/L 3x分)</option>
      </select>
    </div>
    <div class="row">
      <label>每升直減折扣 ($/L)</label>
      <input type="number" id="discount" value="1.60" step="0.1" oninput="calculate()">
    </div>
    <div class="row">
      <label>目標消費金額 ($)</label>
      <input type="number" id="spending" value="500.00" step="10" oninput="calculate()">
    </div>
    <div class="row">
      <label>贈送金額/油券 ($)</label>
      <input type="number" id="giftedAmount" value="268.00" step="10" oninput="calculate()">
    </div>
    <div class="row">
      <label>兌換使用積分 (Points Redeemed)</label>
      <input type="number" id="ptsRedeemed" value="1000" step="100" oninput="calculate()">
    </div>
  </div>

  <script>
    function updateOptions() {
      calculate();
    }

    function applyPreset() {
      const preset = document.getElementById('promoPreset').value;
      if (preset === 'esso_mon') {
        document.getElementById('brand').value = 'Esso';
        document.getElementById('discount').value = 1.60;
        document.getElementById('giftedAmount').value = 268.00;
        document.getElementById('ptsRedeemed').value = 1000;
      } else if (preset === 'esso_tue') {
        document.getElementById('brand').value = 'Esso';
        document.getElementById('discount').value = 8.50;
        document.getElementById('giftedAmount').value = 0;
        document.getElementById('ptsRedeemed').value = 0;
      } else if (preset === 'esso_sat') {
        document.getElementById('brand').value = 'Esso';
        document.getElementById('discount').value = 9.80;
        document.getElementById('giftedAmount').value = 0;
        document.getElementById('ptsRedeemed').value = 0;
      } else if (preset === 'shell_mon') {
        document.getElementById('brand').value = 'Shell';
        document.getElementById('discount').value = 5.00;
        document.getElementById('giftedAmount').value = 0;
        document.getElementById('ptsRedeemed').value = 0;
      } else if (preset === 'shell_tue') {
        document.getElementById('brand').value = 'Shell';
        document.getElementById('discount').value = 7.00;
        document.getElementById('giftedAmount').value = 0;
        document.getElementById('ptsRedeemed').value = 0;
      } else if (preset === 'shell_sat') {
        document.getElementById('brand').value = 'Shell';
        document.getElementById('discount').value = 7.00;
        document.getElementById('giftedAmount').value = 0;
        document.getElementById('ptsRedeemed').value = 0;
      }
      calculate();
    }

    function calculate() {
      const pPremium = parseFloat(document.getElementById('pricePremium').value) || 30.09;
      const pStandard = parseFloat(document.getElementById('priceStandard').value) || 28.29;
      const discount = parseFloat(document.getElementById('discount').value) || 0;
      const spending = parseFloat(document.getElementById('spending').value) || 0;
      const giftedAmount = parseFloat(document.getElementById('giftedAmount').value) || 0;
      const ptsRedeemed = parseFloat(document.getElementById('ptsRedeemed').value) || 0;
      const brand = document.getElementById('brand').value;

      // 1. 付費油量 Volume Paid (L) = Spending / (Premium - Discount)
      const netPaidPriceL = Math.max(0.1, pPremium - discount);
      const volPaid = spending / netPaidPriceL;

      // 2. 贈送油量 Volume Gifted (L) = Gifted Amount / Standard Price
      const volGifted = giftedAmount > 0 ? (giftedAmount / pStandard) : 0;

      // 3. 總油量 Total Volume
      const totalVol = volPaid + volGifted;

      if (totalVol <= 0) return;

      // 4. 點數折算價值 (Point to $)
      // 依 Excel: 1000 點 Esso 相當於 $33.33 超市禮券價值
      const ptsToDollar = (ptsRedeemed / 1000) * 33.33;

      // 5. 優惠後每升單價 (Price per Liter with promotion)
      const pricePerLiterPromo = (spending + ptsToDollar) / totalVol;

      // 6. 每升總折扣 (Total discount per Liter)
      const totalDiscountPerLiter = pPremium - pricePerLiterPromo;

      // 7. 賺取積分計算 (Points Earned)
      let ptsEarned = volPaid * 15; // 基本率
      const preset = document.getElementById('promoPreset').value;
      if (preset === 'esso_sat') ptsEarned *= 2; // 2x 積分
      if (preset === 'shell_sat') ptsEarned *= 3; // 3x 積分

      // 8. 積分回贈金額 (超市禮券換算)
      const ptsCouponVal = (ptsEarned / 1000) * 33.33;

      // 9. 扣除賺取積分後每升淨價
      const pricePerLiterPts = (spending + ptsToDollar - ptsCouponVal) / totalVol;
      const totalDiscountPts = pPremium - pricePerLiterPts;

      // 更新介面
      document.getElementById('res-vol').innerText = totalVol.toFixed(2) + ' L';
      document.getElementById('res-vol-paid').innerText = volPaid.toFixed(2);
      document.getElementById('res-vol-gift').innerText = volGifted.toFixed(2);
      
      document.getElementById('res-price-l').innerText = '$' + pricePerLiterPromo.toFixed(2);
      document.getElementById('res-disc-l').innerText = '$' + totalDiscountPerLiter.toFixed(2);
      
      document.getElementById('res-price-pts').innerText = '$' + pricePerLiterPts.toFixed(2);
      document.getElementById('res-disc-pts').innerText = '$' + totalDiscountPts.toFixed(2);

      document.getElementById('res-pts-earned').innerText = ptsEarned.toFixed(0) + ' pts ($' + ptsCouponVal.toFixed(2) + ')';
    }

    calculate();
  </script>
</body>
</html>
